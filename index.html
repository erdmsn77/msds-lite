<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="description" content="Tersane ve kompozit atölyesi kimyasal güvenlik rehberi (MSDS-Lite). KKD, ilk yardım ve yangın müdahale talimatları.">
  <title>MSDS-Lite | Kompozit & Tekne İSG</title>
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f8fafc" id="themeColorMeta">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('msds-theme') || 'light';
        if (t === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
          var m = document.getElementById('themeColorMeta');
          if (m) m.content = '#0b0f17';
        }
      } catch (e) {}
    })();
  </script>

  <style>
    :root {
      color-scheme: light;
      /* Clean, Daylight Workshop Theme (Light / Saha Teması - Default) */
      --bg-base: #f8fafc;
      --bg-surface: #ffffff;
      --bg-card: #ffffff;
      --bg-card-hover: #f1f5f9;
      --bg-active: #e2e8f0;
      --border-subtle: #cbd5e1;
      --border-strong: #94a3b8;
      --border-focus: #ea580c;
      
      --text-main: #0f172a;
      --text-body: #1e293b;
      --text-muted: #475569;
      --text-dim: #64748b;
      
      --card-shadow: 0 1px 3px rgba(15, 23, 42, 0.08), 0 1px 2px rgba(15, 23, 42, 0.05);
      --card-shadow-hover: 0 10px 25px -5px rgba(15, 23, 42, 0.1), 0 8px 10px -6px rgba(15, 23, 42, 0.08);
      --drawer-shadow: -8px 0 36px rgba(15, 23, 42, 0.22);

      --marine-orange: #ea580c;
      --marine-orange-glow: rgba(234, 88, 12, 0.18);
      --marine-amber: #d97706;
      --marine-red: #dc2626;
      --marine-emerald: #059669;
      --marine-cyan: #0284c7;

      --badge-danger-bg: #fef2f2;
      --badge-danger-text: #b91c1c;
      --badge-danger-border: #fca5a5;

      --badge-warning-bg: #fffbeb;
      --badge-warning-text: #b45309;
      --badge-warning-border: #fcd34d;

      --badge-fire-bg: #fff1f2;
      --badge-fire-text: #be123c;
      --badge-fire-border: #fecdd3;

      --badge-health-bg: #eff6ff;
      --badge-health-text: #1d4ed8;
      --badge-health-border: #bfdbfe;

      --badge-env-bg: #ecfdf5;
      --badge-env-text: #047857;
      --badge-env-border: #a7f3d0;

      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --bg-base: #0b0f17;
      --bg-surface: #111827;
      --bg-card: #151e2e;
      --bg-card-hover: #1e293b;
      --bg-active: #283548;
      --border-subtle: #2d3748;
      --border-strong: #475569;
      --border-focus: #f97316;
      
      --text-main: #f8fafc;
      --text-body: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      
      --card-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      --card-shadow-hover: 0 8px 24px rgba(0, 0, 0, 0.5);
      --drawer-shadow: -8px 0 32px rgba(0, 0, 0, 0.75);

      --badge-danger-bg: rgba(220, 38, 38, 0.22);
      --badge-danger-text: #fca5a5;
      --badge-danger-border: rgba(239, 68, 68, 0.45);

      --badge-warning-bg: rgba(217, 119, 6, 0.22);
      --badge-warning-text: #fde68a;
      --badge-warning-border: rgba(245, 158, 11, 0.45);

      --badge-fire-bg: rgba(190, 18, 60, 0.22);
      --badge-fire-text: #fecdd3;
      --badge-fire-border: rgba(244, 63, 94, 0.45);

      --badge-health-bg: rgba(29, 78, 216, 0.22);
      --badge-health-text: #bfdbfe;
      --badge-health-border: rgba(59, 130, 246, 0.45);

      --badge-env-bg: rgba(4, 120, 87, 0.22);
      --badge-env-text: #a7f3d0;
      --badge-env-border: rgba(16, 185, 129, 0.45);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html {
      background-color: var(--bg-base);
      color: var(--text-body);
      min-height: 100%;
      min-height: 100dvh;
      overscroll-behavior-y: none;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-body);
      font-family: var(--font-sans);
      min-height: 100%;
      min-height: 100dvh;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
      overscroll-behavior-y: none;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .marine-shell {
      max-width: 1240px;
      margin: 0 auto;
      padding: 16px 20px 60px;
    }

    /* Top bar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: #0f172a;
      border: 1px solid rgba(234, 88, 12, 0.45);
      color: #ffffff;
      display: grid;
      place-items: center;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
      flex-shrink: 0;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .brand-icon:hover {
      transform: scale(1.08) rotate(4deg);
    }
    .brand-icon:active {
      transform: scale(0.92) rotate(-6deg);
    }
    .brand-icon.spin {
      animation: logoSpin 0.65s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes logoSpin {
      0% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(1.22) rotate(180deg); filter: drop-shadow(0 0 14px #ea580c); }
      100% { transform: scale(1) rotate(360deg); }
    }
    .brand-eyebrow {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--marine-orange);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--marine-emerald);
      box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.25);
    }
    .brand-title {
      font-size: 22px;
      font-weight: 850;
      letter-spacing: -0.02em;
      line-height: 1.2;
      color: var(--text-main);
    }
    .brand-subtitle {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Theme Toggle Button */
    .theme-toggle-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 650;
      color: var(--text-main);
      cursor: pointer;
      box-shadow: var(--card-shadow);
      transition: background-color 0.12s ease, border-color 0.12s ease;
    }
    .theme-toggle-btn:hover {
      border-color: var(--marine-orange);
    }

    /* Language Switcher */
    .lang-switch {
      display: flex;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 3px;
      box-shadow: var(--card-shadow);
    }
    .lang-btn {
      border: 0;
      background: transparent;
      color: var(--text-muted);
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 750;
      border-radius: 6px;
      cursor: pointer;
      touch-action: manipulation;
      transition: background-color 0.12s ease, color 0.12s ease;
    }
    .lang-btn.active {
      background: var(--marine-orange);
      color: #ffffff;
      box-shadow: 0 2px 6px var(--marine-orange-glow);
    }

    /* Workshop Controls */
    .controls-panel {
      margin-top: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Category Filter Ribbon */
    .category-grid {
      display: flex;
      flex-wrap: nowrap;
      overflow-x: auto;
      gap: 8px;
      padding: 4px 2px 8px;
      scrollbar-width: none;
      -ms-overflow-style: none;
      -webkit-overflow-scrolling: touch;
    }
    .category-grid::-webkit-scrollbar {
      display: none;
    }
    .category-card {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
      white-space: nowrap;
      flex-shrink: 0;
      color: var(--text-body);
      box-shadow: var(--card-shadow);
      font-size: 12px;
      font-weight: 650;
      transition: border-color 0.15s ease, background-color 0.15s ease, transform 0.1s ease;
    }
    .category-card:hover {
      border-color: var(--marine-orange);
    }
    .category-card.active {
      background: var(--marine-orange);
      color: #ffffff;
      border-color: var(--marine-orange);
      box-shadow: 0 4px 12px var(--marine-orange-glow);
    }
    .category-card-count {
      font-size: 10px;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.08);
      color: inherit;
    }
    .category-card.active .category-card-count {
      background: rgba(255, 255, 255, 0.28);
      color: #ffffff;
    }

    .list-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 650;
      color: var(--text-dim);
      padding: 0 4px;
    }

    /* Responsive Grid for all 11 chemicals */
    .chemical-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 14px;
      margin-top: 10px;
    }

    /* Chemical Card (Katman 1: Özet Kart) */
    .chemical-card {
      position: relative;
      display: flex;
      flex-direction: column;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 0;
      text-align: left;
      cursor: pointer;
      overflow: hidden;
      box-shadow: var(--card-shadow);
      touch-action: manipulation;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }
    .chemical-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--card-shadow-hover);
      border-color: var(--marine-orange);
    }
    .chemical-card:focus-visible {
      outline: 2px solid var(--border-focus);
      outline-offset: 2px;
    }

    .card-risk-topline {
      height: 4px;
      width: 100%;
    }
    .risk-critical { background: var(--marine-red); }
    .risk-high { background: var(--marine-orange); }
    .risk-medium { background: var(--marine-amber); }

    .card-inner {
      padding: 14px 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }

    /* Top Row: Category tag, Signal badge, Risk pill */
    .card-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .card-category-badge {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      background: var(--bg-active);
      padding: 2px 8px;
      border-radius: 6px;
    }
    .card-signals {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .signal-tag {
      font-size: 10px;
      font-weight: 850;
      letter-spacing: 0.04em;
      padding: 2px 8px;
      border-radius: 6px;
      border-width: 1px;
      border-style: solid;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .signal-danger {
      background: var(--badge-danger-bg);
      color: var(--badge-danger-text);
      border-color: var(--badge-danger-border);
    }
    .signal-warning {
      background: var(--badge-warning-bg);
      color: var(--badge-warning-text);
      border-color: var(--badge-warning-border);
    }
    .card-risk-pill {
      font-size: 9px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
      color: #fff;
    }

    /* Title & CAS */
    .card-title {
      font-size: 17px;
      font-weight: 850;
      color: var(--text-main);
      line-height: 1.25;
      letter-spacing: -0.01em;
    }
    .card-cas-line {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-muted);
    }
    .cas-badge {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      background: var(--bg-active);
      padding: 1px 6px;
      border-radius: 4px;
      color: var(--text-main);
    }
    .chem-subname {
      color: var(--text-dim);
    }

    /* GHS Diamonds & Hazard Statement */
    .card-hazard-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      background: var(--bg-base);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 8px 10px;
    }
    .card-ghs-diamonds {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }
    .ghs-diamond-mini {
      width: 26px;
      height: 26px;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.15));
    }
    .ghs-diamond-large {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
    }
    .card-hazard-text {
      font-size: 11px;
      font-weight: 550;
      line-height: 1.4;
      color: var(--text-body);
      flex: 1;
    }

    /* Three Color-Coded Emergency Badges: Yangın (Kırmızı), Sağlık (Mavi), Çevre (Yeşil) */
    .card-emergency-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .badge-pill {
      font-size: 10.5px;
      font-weight: 650;
      padding: 3px 8px;
      border-radius: 6px;
      border-width: 1px;
      border-style: solid;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
    }
    .badge-fire {
      background: var(--badge-fire-bg);
      color: var(--badge-fire-text);
      border-color: var(--badge-fire-border);
    }
    .badge-health {
      background: var(--badge-health-bg);
      color: var(--badge-health-text);
      border-color: var(--badge-health-border);
    }
    .badge-env {
      background: var(--badge-env-bg);
      color: var(--badge-env-text);
      border-color: var(--badge-env-border);
    }

    /* Card Footer: Timer info + Action CTA */
    .card-footer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
      padding-top: 8px;
      border-top: 1px solid var(--border-subtle);
    }
    .card-timer-badge {
      font-size: 11px;
      font-weight: 750;
      color: var(--marine-orange);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .card-action-cta {
      font-size: 11.5px;
      font-weight: 750;
      color: var(--text-main);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: color 0.12s ease;
    }
    .chemical-card:hover .card-action-cta {
      color: var(--marine-orange);
    }

    /* Empty State */
    .empty-state {
      padding: 48px 16px;
      text-align: center;
      background: var(--bg-card);
      border: 1px dashed var(--border-subtle);
      border-radius: 12px;
      grid-column: 1 / -1;
    }
    .empty-title {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }
    .empty-btn {
      padding: 8px 16px;
      background: var(--marine-orange);
      color: #fff;
      border: 0;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Drawer Modal (Katman 2: Hızlı Acil Durum Paneli) */
    .drawer-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 99;
    }
    .drawer-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      max-width: 580px;
      background: var(--bg-surface);
      color: var(--text-body);
      box-shadow: var(--drawer-shadow);
      z-index: 100;
      transform: translateX(100%);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      touch-action: pan-y;
    }
    .drawer.open {
      transform: translateX(0);
    }

    .drawer-header {
      padding: 16px 20px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-subtle);
      flex-shrink: 0;
    }
    .drawer-header-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    .drawer-category-tag {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--marine-orange);
      margin-bottom: 4px;
      display: inline-block;
    }
    .drawer-title {
      font-size: 20px;
      font-weight: 850;
      color: var(--text-main);
      line-height: 1.2;
    }
    .drawer-chemical-name {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .drawer-close {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      background: var(--bg-base);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      font-size: 18px;
      display: grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background-color 0.12s ease;
    }
    .drawer-close:hover {
      background: var(--bg-active);
    }

    /* Quick jump navigation inside drawer */
    .drawer-nav-pills {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 10px 20px;
      background: var(--bg-base);
      border-bottom: 1px solid var(--border-subtle);
      flex-shrink: 0;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x;
    }
    .drawer-nav-pills::-webkit-scrollbar { display: none; }
    .drawer-nav-pill {
      border: 1px solid var(--border-subtle);
      background: var(--bg-surface);
      color: var(--text-body);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      text-decoration: none;
    }
    .drawer-nav-pill:hover {
      border-color: var(--marine-orange);
      color: var(--marine-orange);
    }

    .drawer-body {
      padding: 16px 20px 48px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex: 1;
    }

    /* Incompatibility banner */
    .incompatibility-box {
      border: 1.5px solid var(--marine-red);
      background: rgba(220, 38, 38, 0.08);
      border-radius: 10px;
      padding: 14px;
    }
    .incompatibility-box.warning-box {
      border-color: var(--marine-amber);
      background: rgba(217, 119, 6, 0.08);
    }
    .incompatibility-header {
      font-size: 11px;
      font-weight: 850;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--marine-red);
      margin-bottom: 4px;
    }
    .incompatibility-box.warning-box .incompatibility-header {
      color: var(--marine-amber);
    }
    .incompatibility-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 6px;
    }
    .incompatibility-text {
      font-size: 12px;
      line-height: 1.5;
      color: var(--text-body);
    }
    .incompatibility-source {
      font-size: 10px;
      color: var(--text-dim);
      margin-top: 6px;
    }

    /* High-Visibility Emergency Rinse Banner (Replaces Timer Console) */
    .emergency-time-banner {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(220, 38, 38, 0.08);
      border: 1.5px solid var(--marine-red);
      border-radius: 8px;
      padding: 12px 14px;

      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-subtle);

    .section-icon {
      font-size: 16px;

    }
    .detail-item-block:last-child {

    .top-progress-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 3.5px;
      z-index: 99999;
      pointer-events: none;
      background: transparent;
      overflow: hidden;
      transition: opacity 0.3s ease-out;
    }
    .top-progress-bar.done {

    }
    .top-progress-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #ea580c 0%, #f97316 60%, #dc2626 100%);

      transform: translateX(-100%);

    }
    @keyframes topProgressAnim {

      60% { transform: translateX(-15%); }
      100% { transform: translateX(0%); }

      const state = {
        chemicals: [],
        language: localStorage.getItem('msds-language') || 'tr',

        category: 'all',
        selectedChemical: null

      const t = (key) => (translations[state.language] && translations[state.language][key]) || key;
      const escape = (val) => String(val || '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[c]));
      const getL = (val) => (typeof val === 'object' && val !== null && !Array.isArray(val)) ? (val[state.language] || val.tr || '') : (val || '');

      function renderGhsDiamond(code, sizeClass = 'ghs-diamond-mini') {
        const meta = GHS_METADATA[code] || GHS_METADATA.GHS07;
        return `<svg viewBox="0 0 100 100" class="${sizeClass}" aria-label="${escape(code)}"><polygon points="50,6 94,50 50,94 6,50" fill="#ffffff" stroke="#ef4444" stroke-width="7" stroke-linejoin="round"/>${meta.svg}</svg>`;
      }

      function getFilteredChemicals() {
        return state.chemicals.filter((chem) => {
          return state.category === 'all' || chem.category === state.category;
        });
      }

      // Fast, targeted list renderer (Only updates list container)
      function renderChemicalList() {
        const listEl = document.getElementById('chemicalList');
        const countEl = document.getElementById('resultsCount');
        if (!listEl) return;

        const filtered = getFilteredChemicals();
        if (countEl) countEl.textContent = `${filtered.length} ${t('records')}`;

        if (filtered.length === 0) {
          listEl.innerHTML = `
            <div class="empty-state">
              <p class="empty-title">${t('noResults')}</p>
              <button type="button" class="empty-btn" id="emptyResetBtn">${t('clearSearch')}</button>
            </div>
          `;
          document.getElementById('emptyResetBtn')?.addEventListener('click', () => {
            state.category = 'all';
            document.querySelectorAll('.category-card').forEach(c => {
              c.classList.toggle('active', c.dataset.cat === 'all');
            });
            renderChemicalList();
          });
          return;
        }

        listEl.innerHTML = filtered.map((chem) => {
          const riskClass = chem.risk_level === 'KRİTİK' ? 'risk-critical' : chem.risk_level === 'YÜKSEK' ? 'risk-high' : 'risk-medium';
          const riskText = chem.risk_level === 'KRİTİK' ? t('riskCritical') : chem.risk_level === 'YÜKSEK' ? t('riskHigh') : t('riskMedium');
          const catLabel = (CATEGORIES[chem.category] && CATEGORIES[chem.category][state.language]) || chem.category;
          const ghsMiniHtml = (chem.ghs_codes || []).map(c => renderGhsDiamond(c, 'ghs-diamond-mini')).join('');

          const isDanger = (chem.signal_word && (chem.signal_word.tr === 'TEHLİKE' || chem.signal_word === 'TEHLİKE'));
          const signalClass = isDanger ? 'signal-danger' : 'signal-warning';
          const signalIcon = isDanger ? '⚠️' : '⚡';

          return `
            <article class="chemical-card" data-chemical-id="${escape(chem.id)}" role="button" tabindex="0" aria-label="${escape(getL(chem.name))}">
              <div class="card-risk-topline ${riskClass}"></div>
              <div class="card-inner">
                <div class="card-top-row">
                  <span class="card-category-badge">${escape(catLabel)}</span>
                  <div class="card-signals">
                    <span class="signal-tag ${signalClass}">${signalIcon} ${escape(getL(chem.signal_word))}</span>
                    <span class="card-risk-pill ${riskClass}">${escape(riskText)}</span>
                  </div>
                </div>

                <div>
                  <h2 class="card-title">${escape(getL(chem.name))}</h2>
                  <div class="card-cas-line">
                    <span class="cas-badge">CAS: ${escape(chem.cas || '—')}</span>
                    <span class="chem-subname">${escape(getL(chem.chemical_name))}</span>
                  </div>
                </div>

                <div class="card-hazard-row">
                  <div class="card-ghs-diamonds">${ghsMiniHtml}</div>
                  <div class="card-hazard-text">${escape(getL(chem.hazard_statement))}</div>
                </div>

                <div class="card-emergency-badges">
                  <span class="badge-pill badge-fire">${escape(getL(chem.badges?.fire))}</span>
                  <span class="badge-pill badge-health">${escape(getL(chem.badges?.health))}</span>
                  <span class="badge-pill badge-env">${escape(getL(chem.badges?.environment))}</span>
                </div>

                <div class="card-footer-row">
                  <span class="card-timer-badge">⏱ ${t('atLeast')} ${chem.emergency_timer_min || 15} ${t('minutes')} ${t('emergencyWashShort')}</span>
                  <span class="card-action-cta">${t('viewDetails')} →</span>
                </div>
              </div>
            </article>
          `;
        }).join('');
      }

      // Render Shell (Only runs on initial boot, language change, or theme change)
      function renderShell() {
        document.documentElement.lang = state.language;
        document.documentElement.setAttribute('data-theme', state.theme);
        const meta = document.getElementById('themeColorMeta');
        if (meta) meta.content = state.theme === 'dark' ? '#0b0f17' : '#f8fafc';
        document.title = `${t('appTitle')} | ${t('tagline')}`;
        
        const app = document.getElementById('marineApp');
        const totalCount = state.chemicals.length;

        // Category grid cards with icons
        const categoryGridHtml = Object.entries(CATEGORIES).map(([catKey, labelObj]) => {
          const isSelected = state.category === catKey;
          const count = catKey === 'all' 
            ? totalCount 
            : state.chemicals.filter(c => c.category === catKey).length;
          const iconHtml = labelObj.icon ? `<span style="margin-right:4px;">${labelObj.icon}</span>` : '';
          return `<button type="button" class="category-card ${isSelected ? 'active' : ''}" data-cat="${catKey}">
            ${iconHtml}<span>${labelObj[state.language]}</span>
            <span class="category-card-count">${count}</span>
          </button>`;
        }).join('');

        const themeBtnText = state.theme === 'dark' ? t('themeLight') : t('themeDark');

        app.innerHTML = `
          <div class="marine-shell">
            <header class="topbar">
              <div class="brand-wrap">
                <div class="brand-icon" id="brandLogoBtn" role="button" tabindex="0" title="MSDS-Lite GHS">

                    <path d="M50 26 c-2 7 -7 11 -7 18 c0 6 3 9 6 11 c-4 -2 -6 -7 -5 -12 c-4 5 -7 13 -4 20 c3 6 9 9 15 9 c8 -1 14 -8 13 -16 c-1 -7 -6 -12 -11 -15 c2 3 2 8 0 10 c-2 -4 -4 -12 -7 -25 z" fill="#0f172a"/>

                  <p class="brand-subtitle">${t('subtitle')}</p>

                  <button type="button" class="lang-btn ${state.language === 'en' ? 'active' : ''}" data-lang="en">EN</button>
                  <button type="button" class="lang-btn ${state.language === 'de' ? 'active' : ''}" data-lang="de">DE</button>
                </div>

            <section class="controls-panel" aria-label="Controls">
              <div class="category-grid" id="categoryGrid">
                ${categoryGridHtml}
              </div>

              <div class="list-meta">
                <span id="resultsCount">0 ${t('records')}</span>
                <span>${t('touchHint')}</span>
              </div>
            </section>

            <main class="chemical-list" id="chemicalList" aria-live="polite"></main>

            <footer class="marine-footer">
              <p>${t('disclaimer')}</p>
            </footer>
          </div>

          <div id="drawerBackdrop" class="drawer-backdrop"></div>
          <aside id="detailDrawer" class="drawer" aria-hidden="true" role="dialog"></aside>
        `;

        bindShellEvents();
        renderChemicalList();
      }

      // Render Drawer Content (Katman 2: Hızlı Acil Durum Paneli)
      function renderDrawerContent(chem) {
        const riskClass = chem.risk_level === 'KRİTİK' ? 'risk-critical' : chem.risk_level === 'YÜKSEK' ? 'risk-high' : 'risk-medium';
        const riskText = chem.risk_level === 'KRİTİK' ? t('riskCritical') : chem.risk_level === 'YÜKSEK' ? t('riskHigh') : t('riskMedium');
        const catLabel = (CATEGORIES[chem.category] && CATEGORIES[chem.category][state.language]) || chem.category;

        // Incompatibility alert
        const incomp = INCOMPATIBILITY_ALERTS[chem.id];
        let incompHtml = '';
        if (incomp) {
          const isCrit = incomp.level === 'critical';
          const header = isCrit ? t('incompatibilityNotice') : t('warningNotice');
          const title = state.language === 'tr' ? incomp.title_tr : (state.language === 'de' ? incomp.title_de : incomp.title_en);
          const text = state.language === 'tr' ? incomp.text_tr : (state.language === 'de' ? incomp.text_de : incomp.text_en);
          incompHtml = `
            <div class="incompatibility-box ${isCrit ? '' : 'warning-box'}">
              <div class="incompatibility-header">⚠️ ${escape(header)}</div>
              <div class="incompatibility-title">${escape(title)}</div>
              <div class="incompatibility-text">${escape(text)}</div>
              <div class="incompatibility-source">${escape(incomp.source)}</div>
            </div>
          `;
        }

        // GHS large cards
        const ghsCardsHtml = (chem.ghs_codes || []).map(c => {
          const meta = GHS_METADATA[c] || GHS_METADATA.GHS07;
          const title = state.language === 'tr' ? meta.title_tr : (state.language === 'de' ? meta.title_de : meta.title_en);
          const desc = state.language === 'tr' ? meta.desc_tr : (state.language === 'de' ? meta.desc_de : meta.desc_en);
          return `
            <div class="ghs-card-item">
              ${renderGhsDiamond(c, 'ghs-diamond-large')}
              <div class="ghs-card-meta">
                <div class="ghs-card-code">${escape(c)}</div>
                <div class="ghs-card-name">${escape(title)}</div>
                <div class="ghs-card-desc">${escape(desc)}</div>
              </div>
            </div>
          `;
        }).join('');

        const gloves = chem.ppe ? chem.ppe.gloves : { latex: false, nitrile: true, butyl: true, warning: '' };
        const sourceLinkHtml = chem.source_url 
          ? `<a href="${escape(chem.source_url)}" class="source-link-btn" target="_blank" rel="noopener noreferrer" style="color:var(--marine-orange); font-weight:700; text-decoration:none;">${t('openSource')} ↗</a>`
          : `<span style="color:var(--text-dim);">${t('canonicalSource')}</span>`;

        const isDanger = (chem.signal_word && (chem.signal_word.tr === 'TEHLİKE' || chem.signal_word === 'TEHLİKE'));
        const signalClass = isDanger ? 'signal-danger' : 'signal-warning';

        return `
          <div class="drawer-header">
            <div class="drawer-header-top">
              <div>
                <span class="drawer-category-tag">${escape(catLabel)}</span>
                <h2 class="drawer-title" id="drawerTitle">${escape(getL(chem.name))}</h2>
                <div class="drawer-chemical-name">CAS: ${escape(chem.cas || '—')} | ${escape(getL(chem.chemical_name))}</div>
                <div style="margin-top:6px; display:flex; gap:6px; align-items:center;">
                  <span class="signal-tag ${signalClass}">${isDanger ? '⚠️' : '⚡'} ${escape(getL(chem.signal_word))}</span>
                  <span class="card-risk-pill ${riskClass}">${escape(riskText)}</span>

      function openDrawer(chemicalId, shouldPushHistory = true) {
        const chem = state.chemicals.find(c => c.id === chemicalId);
        if (!chem) return;

        state.selectedChemical = chem;

        // Push history state so phone back button/gesture returns to main menu instead of closing app
        if (shouldPushHistory && window.location.hash !== '#' + chem.id) {
          history.pushState({ drawerOpen: true, chemId: chem.id }, '', '#' + chem.id);
        }

        const drawer = document.getElementById('detailDrawer');
        const backdrop = document.getElementById('drawerBackdrop');
        if (drawer && backdrop) {
          drawer.innerHTML = renderDrawerContent(chem);
          drawer.classList.add('open');
          drawer.setAttribute('aria-hidden', 'false');
          backdrop.classList.add('open');
          bindDrawerEvents();
        }
      }

      function closeDrawer(syncHistory = false) {
        const drawer = document.getElementById('detailDrawer');
        const backdrop = document.getElementById('drawerBackdrop');
        if (drawer) {
          drawer.classList.remove('open');
          drawer.setAttribute('aria-hidden', 'true');
        }
        if (backdrop) {
          backdrop.classList.remove('open');
        }
        if (syncHistory && window.location.hash) {
          try {
            history.replaceState(null, '', window.location.pathname + window.location.search);
          } catch (e) {}
        }
      }

      // Safe user-initiated close (Backdrop, Close Button or Swipe)
      function handleUserClose() {
        if (window.location.hash) {
          // Pops history naturally, triggering popstate which closes drawer cleanly
          history.back();
        } else {
          closeDrawer(true);
        }
      }

      function bindDrawerEvents() {
        const drawer = document.getElementById('detailDrawer');
        if (!drawer) return;

        drawer.querySelector('#drawerCloseBtn')?.addEventListener('click', handleUserClose);

        // Smooth scroll for nav pills inside drawer
        drawer.querySelectorAll('.drawer-nav-pill').forEach(pill => {
          pill.addEventListener('click', (e) => {
            e.preventDefault();
            const targetId = pill.getAttribute('href').replace('#', '');
            const targetEl = drawer.querySelector('#' + targetId);
            if (targetEl) {
              targetEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
          });
        });

        // Swipe-to-dismiss gesture on mobile (yalnızca sol kenardan veya başlıktan çekildiğinde kapatır)
        let touchStartX = 0;
        let touchStartY = 0;
        let touchCurrentX = 0;
        let canSwipeDismiss = false;

        drawer.ontouchstart = (e) => {
          // Yatay kaydırılan menü çubuğu (pills), buton veya form alanlarında asla kapatma tetikleme
          if (e.target.closest('.drawer-nav-pills') || e.target.closest('button') || e.target.closest('input')) {
            canSwipeDismiss = false;
            return;
          }

          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
          touchCurrentX = touchStartX;

          // Yalnızca ekranın sol kenarından çekiliyorsa (iOS/Android native geri alanı: ilk 45px)
          // VEYA üst başlıktan (drawer-header) çekiliyorsa izin ver. Ekranın ortasındaki kaydırmalarda kapatma.
          const isEdgeSwipe = touchStartX <= 45;
          const isHeaderDrag = !!e.target.closest('.drawer-header');

          canSwipeDismiss = isEdgeSwipe || isHeaderDrag;
        };

        drawer.ontouchmove = (e) => {
          if (!canSwipeDismiss) return;
          touchCurrentX = e.touches[0].clientX;
        };

        drawer.ontouchend = (e) => {
          if (!canSwipeDismiss) return;
          const deltaX = touchCurrentX - touchStartX;
          const deltaY = Math.abs((e.changedTouches[0]?.clientY || touchStartY) - touchStartY);

          // Yalnızca sağa doğru kararlı çekme varsa (en az 80px ve yatay hareket dikey hareketten belirgin biçimde fazlaysa)
          if (deltaX > 80 && deltaX > deltaY * 1.4) {
            handleUserClose();
          }
          canSwipeDismiss = false;
        };
      }

      function bindShellEvents() {
        const app = document.getElementById('marineApp');
        if (!app) return;

        // Theme Toggle
        app.querySelector('#themeToggleBtn')?.addEventListener('click', () => {
          state.theme = state.theme === 'dark' ? 'light' : 'dark';
          localStorage.setItem('msds-theme', state.theme);
          document.documentElement.setAttribute('data-theme', state.theme);
          const meta = document.getElementById('themeColorMeta');
          if (meta) meta.content = state.theme === 'dark' ? '#0b0f17' : '#f8fafc';
          const btn = document.getElementById('themeToggleBtn');
          if (btn) btn.textContent = state.theme === 'dark' ? t('themeLight') : t('themeDark');
        });

        // Language Switch
        app.querySelectorAll('.lang-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const newLang = btn.dataset.lang;
            if (state.language !== newLang) {
              state.language = newLang;
              localStorage.setItem('msds-language', newLang);
              const drawerWasOpen = document.getElementById('detailDrawer')?.classList.contains('open');
              const selectedId = state.selectedChemical?.id;
              renderShell();
              if (drawerWasOpen && selectedId) {
                openDrawer(selectedId, false);
              }
            }
          });
        });

        // Category Filter Buttons
        app.querySelectorAll('.category-card').forEach(card => {
          card.addEventListener('click', () => {
            state.category = card.dataset.cat;
            app.querySelectorAll('.category-card').forEach(c => {
              c.classList.toggle('active', c.dataset.cat === state.category);
            });
            renderChemicalList();
          });
        });

        // Mouse drag-to-scroll for horizontal category ribbon
        const categoryGrid = document.getElementById('categoryGrid');
        if (categoryGrid) {
          let isDown = false;
          let startX;
          let scrollLeft;

          categoryGrid.addEventListener('mousedown', (e) => {
            isDown = true;
            categoryGrid.style.cursor = 'grabbing';
            startX = e.pageX - categoryGrid.offsetLeft;
            scrollLeft = categoryGrid.scrollLeft;
          });
          categoryGrid.addEventListener('mouseleave', () => {
            isDown = false;
            categoryGrid.style.cursor = '';
          });
          categoryGrid.addEventListener('mouseup', () => {
            isDown = false;
            categoryGrid.style.cursor = '';
          });
          categoryGrid.addEventListener('mousemove', (e) => {
            if (!isDown) return;
            e.preventDefault();
            const x = e.pageX - categoryGrid.offsetLeft;
            const walk = (x - startX) * 2;
            categoryGrid.scrollLeft = scrollLeft - walk;
          });
        }

        // Chemical card clicks (Event delegation on container, 100% reliable)
        const chemicalList = document.getElementById('chemicalList');
        if (chemicalList) {
          chemicalList.addEventListener('click', (e) => {
            const card = e.target.closest('.chemical-card');
            if (card) {
              const chemId = card.dataset.chemicalId;
              openDrawer(chemId, true);
            }
          });
          // Keyboard Enter / Space support for accessibility
          chemicalList.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              const card = e.target.closest('.chemical-card');
              if (card) {
                e.preventDefault();
                const chemId = card.dataset.chemicalId;
                openDrawer(chemId, true);
              }
            }
          });
        }

        // Interactive Logo Animation on Click / Tap / Enter
        const brandLogo = document.getElementById('brandLogoBtn');
        if (brandLogo) {
          const triggerLogoAnim = () => {
            brandLogo.classList.remove('spin');
            void brandLogo.offsetWidth; // Force CSS reflow to retrigger animation
            brandLogo.classList.add('spin');
          };
          brandLogo.addEventListener('click', triggerLogoAnim);
          brandLogo.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              triggerLogoAnim();
            }
          });
        }

        // Backdrop click closes drawer
        document.getElementById('drawerBackdrop')?.addEventListener('click', handleUserClose);
      }

      // Keyboard Esc to close drawer
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') handleUserClose();
      });

      // Phone Back Button & Gesture (popstate handles phone back navigation cleanly)
      window.addEventListener('popstate', () => {
        const hash = window.location.hash.replace('#', '');
        const drawer = document.getElementById('detailDrawer');
        const isDrawerOpen = drawer && drawer.classList.contains('open');

        if (hash) {
          openDrawer(hash, false);
        } else if (isDrawerOpen) {
          closeDrawer(false);
        }
      });

      // Initialization
      function init() {
        // 1. Instant Synchronous Boot (0ms render, 100% offline-ready)
        state.chemicals = fallbackChemicals;
        renderShell();

        // 2. Check initial hash for deep link
        const initialHash = window.location.hash.replace('#', '');
        if (initialHash) {
          openDrawer(initialHash, false);
        }

        // 3. Zarif Turuncu Üst Bar Tamamlanma & Kaybolma
        const bar = document.getElementById('topProgressBar');
        if (bar) {
          setTimeout(() => {
            bar.classList.add('done');
            setTimeout(() => bar.remove(), 350);
          }, 550);
        }

        // 4. Non-blocking background sync with abort timeout (prevents mobile/offline hang)
        if (window.location.protocol !== 'file:') {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 2500);

          fetch('./data/chemicals.json', { signal: controller.signal })
            .then(res => res.ok ? res.json() : null)
            .then(data => {
              clearTimeout(timeoutId);
              if (Array.isArray(data) && data.length > 0 && JSON.stringify(data) !== JSON.stringify(state.chemicals)) {
                state.chemicals = data;
                renderChemicalList();
              }
            })
            .catch(() => {
              // Silently ignore network aborts/errors, fallbackChemicals is already active
            });
        }
      }

      init();
    })();

    // Service Worker
    if ('serviceWorker' in navigator && window.location.protocol !== 'file:') {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { scope: './' })
          .then((reg) => {
            console.info('MSDS-Lite service worker ready.');
            reg.update().catch(() => {});
          })
          .catch((err) => console.warn('SW failed:', err));
      });
    }
  </script>
