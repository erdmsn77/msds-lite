      function bindSdsModalEvents() {
        const modal = document.getElementById('sdsModal');
        if (!modal) return;

        modal.querySelector('#sdsModalCloseBtn')?.addEventListener('click', closeSdsModal);

        const tabPdfBtn = modal.querySelector('#tabPdfBtn');
        const tabTextBtn = modal.querySelector('#tabTextBtn');
        const tabBackupBtn = modal.querySelector('#tabBackupBtn');
        const panePdf = modal.querySelector('#sdsPanePdf');
        const paneText = modal.querySelector('#sdsPaneText');
        const paneBackup = modal.querySelector('#sdsPaneBackup');

        function setTab(activeTab) {
          tabPdfBtn?.classList.toggle('active', activeTab === 'pdf');
          tabTextBtn?.classList.toggle('active', activeTab === 'text');
          tabBackupBtn?.classList.toggle('active', activeTab === 'backup');
          panePdf?.classList.toggle('active', activeTab === 'pdf');
          paneText?.classList.toggle('active', activeTab === 'text');
          paneBackup?.classList.toggle('active', activeTab === 'backup');
          if (activeTab === 'backup') {
            renderSdsBackupPane();
          }
        }

        tabPdfBtn?.addEventListener('click', () => setTab('pdf'));
        tabTextBtn?.addEventListener('click', () => setTab('text'));
        tabBackupBtn?.addEventListener('click', () => setTab('backup'));

        const dropZone = modal.querySelector('#sdsDropZone');
        const fileInput = modal.querySelector('#sdsFileInput');
        const browseBtn = modal.querySelector('#sdsBrowseBtn');
        const statusBar = modal.querySelector('#sdsStatusBar');

        browseBtn?.addEventListener('click', (e) => {
          e.stopPropagation();
          fileInput?.click();
        });

        dropZone?.addEventListener('click', () => {
          fileInput?.click();
        });

        dropZone?.addEventListener('dragover', (e) => {
          e.preventDefault();
          dropZone.classList.add('dragover');
        });

        dropZone?.addEventListener('dragleave', () => {
          dropZone.classList.remove('dragover');
        });

        async function processFile(file) {
          if (!file || !file.name.toLowerCase().endsWith('.pdf')) {
            if (statusBar) {
              statusBar.style.display = 'flex';
              statusBar.className = 'sds-status-bar error';
              statusBar.textContent = t('parseError');
            }
            return;
          }

          if (statusBar) {
            statusBar.style.display = 'flex';
            statusBar.className = 'sds-status-bar loading';
            statusBar.textContent = `${t('readingPdfPages')} (${file.name})`;
          }

          try {
            const arrayBuffer = await file.arrayBuffer();
            const text = await extractTextFromPdfArrayBuffer(arrayBuffer);
            const parsed = parseSdsText(text, file.name);

            if (parsed && parsed.isValid) {
              if (statusBar) {
                statusBar.className = 'sds-status-bar success';
                statusBar.textContent = `${t('parseSuccess')} (${parsed.detected_sections_count}/16 ${t('sdsQualityVerified')})`;
              }
              renderSdsReviewForm(parsed, false);
            } else {
              throw new Error((parsed && parsed.error) || t('sdsNotValidError'));
            }
          } catch (err) {
            console.warn('PDF parse error:', err);
            if (statusBar) {
              statusBar.className = 'sds-status-bar error';
              statusBar.textContent = err.message || t('parseError');
            }
            const previewBox = document.getElementById('sdsPreviewBox');
            if (previewBox) {
              previewBox.style.display = 'none';
              previewBox.innerHTML = '';
            }
          }
        }

        dropZone?.addEventListener('drop', (e) => {
          e.preventDefault();
          dropZone.classList.remove('dragover');
          const file = e.dataTransfer?.files?.[0];
          if (file) processFile(file);
        });

        fileInput?.addEventListener('change', () => {
          const file = fileInput.files?.[0];
          if (file) {
            processFile(file);
            fileInput.value = '';
          }
        });

        const parsePasteBtn = modal.querySelector('#sdsPasteParseBtn');
        const pasteArea = modal.querySelector('#sdsPasteArea');

        parsePasteBtn?.addEventListener('click', () => {
          const raw = pasteArea?.value?.trim();
          if (!raw || raw.length < 25) {
            if (statusBar) {
              statusBar.style.display = 'flex';
              statusBar.className = 'sds-status-bar error';
              statusBar.textContent = t('parseError');
            }
            return;
          }

          if (statusBar) {
            statusBar.style.display = 'flex';
            statusBar.className = 'sds-status-bar loading';
            statusBar.textContent = t('parsingState');
          }

          try {
            const parsed = parseSdsText(raw, 'METIN_GIRIS');
            if (parsed && parsed.isValid) {
              if (statusBar) {
                statusBar.className = 'sds-status-bar success';
                statusBar.textContent = `${t('parseSuccess')} (${parsed.detected_sections_count}/16 ${t('sdsQualityVerified')})`;
              }
              renderSdsReviewForm(parsed, false);
            } else {
              throw new Error((parsed && parsed.error) || t('sdsNotValidError'));
            }
          } catch (err) {
            if (statusBar) {
              statusBar.className = 'sds-status-bar error';
              statusBar.textContent = err.message || t('parseError');
            }
            const previewBox = document.getElementById('sdsPreviewBox');
            if (previewBox) {
              previewBox.style.display = 'none';
              previewBox.innerHTML = '';
            }
          }
        });

        // Quick-Test Sample Documents for Field & Mobile Validation
        const sampleMap = {
          '1': { url: './samples/sample_1_polipol_3401_tr.pdf', name: 'sample_1_polipol_3401_tr.pdf' },
          '2': { url: './samples/sample_2_west_system_205_en.pdf', name: 'sample_2_west_system_205_en.pdf' },
          '3': { url: './samples/sample_3_butanox_m50_de.pdf', name: 'sample_3_butanox_m50_de.pdf' }
        };

        modal.querySelectorAll('.sds-sample-btn').forEach(btn => {
          btn.addEventListener('click', async () => {
            const sId = btn.dataset.sample;
            const target = sampleMap[sId];
            if (!target) return;

            if (statusBar) {
              statusBar.style.display = 'flex';
              statusBar.className = 'sds-status-bar loading';
              statusBar.textContent = `${t('readingPdfPages')} (${target.name})`;
            }

            try {
              const res = await fetch(target.url);
              if (!res.ok) throw new Error('Örnek PDF yüklenemedi');
              const arrayBuffer = await res.arrayBuffer();
              const text = await extractTextFromPdfArrayBuffer(arrayBuffer);
              const parsed = parseSdsText(text, target.name);

              if (parsed && parsed.isValid) {
                if (statusBar) {
                  statusBar.className = 'sds-status-bar success';
                  statusBar.textContent = `${t('parseSuccess')} (${parsed.detected_sections_count}/16 ${t('sdsQualityVerified')})`;
                }
                renderSdsReviewForm(parsed, false);
              } else {
                throw new Error((parsed && parsed.error) || t('sdsNotValidError'));
              }
            } catch (err) {
              console.warn('Sample SDS parse error:', err);
              if (statusBar) {
                statusBar.className = 'sds-status-bar error';
                statusBar.textContent = err.message || t('parseError');
              }
            }
          });
        });
      }

      function openSdsModal() {
        renderSdsModalContent();

          modal.classList.add('open');
          backdrop.classList.add('open');
          modal.setAttribute('aria-hidden', 'false');
          document.body.style.overflow = 'hidden';
        }
      }

      function closeSdsModal() {
        const modal = document.getElementById('sdsModal');
        const backdrop = document.getElementById('sdsModalBackdrop');
        if (modal && backdrop) {
          modal.classList.remove('open');
          backdrop.classList.remove('open');
          modal.setAttribute('aria-hidden', 'true');
          document.body.style.overflow = '';
        }
      }


      function bindShellEvents() {
        const app = document.getElementById('marineApp');
        if (!app) return;

        // Theme Toggle
        app.querySelector('#themeToggleBtn')?.addEventListener('click', () => {
          state.theme = state.theme === 'dark' ? 'light' : 'dark';
          localStorage.setItem('msds-theme', state.theme);
          localStorage.setItem('msds-theme-manual', 'true');
          document.documentElement.setAttribute('data-theme', state.theme);
          const meta = document.getElementById('themeColorMeta');
          if (meta) meta.content = state.theme === 'dark' ? '#0b0f17' : '#f8fafc';
          const btn = document.getElementById('themeToggleBtn');
          if (btn) btn.textContent = state.theme === 'dark' ? t('themeLight') : t('themeDark');
        });

        // Language Switch
        app.querySelectorAll('.lang-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const newLang = btn.dataset.lang;
            if (state.language !== newLang) {
              state.language = newLang;
              localStorage.setItem('msds-language', newLang);
              const drawerWasOpen = document.getElementById('detailDrawer')?.classList.contains('open');
              const selectedId = state.selectedChemical?.id;
              const sdsModalOpen = document.getElementById('sdsModal')?.classList.contains('open');
              renderShell();
              if (drawerWasOpen && selectedId) {
                openDrawer(selectedId, false);
              }
              if (sdsModalOpen) {
                openSdsModal();
                if (parsedCurrentChemical) {
                  renderSdsReviewForm(parsedCurrentChemical, !!parsedCurrentChemical.is_custom);
                }
              }
            }
          });
        });

        // Search Input Handling
        const searchInput = document.getElementById('searchInput');
        const searchClearBtn = document.getElementById('searchClearBtn');

        if (searchInput) {
          let searchRaf = null;
          searchInput.addEventListener('input', (e) => {
            state.searchQuery = e.target.value;
            if (searchClearBtn) {
              searchClearBtn.classList.toggle('visible', !!state.searchQuery);
            }
            if (searchRaf) cancelAnimationFrame(searchRaf);
            searchRaf = requestAnimationFrame(() => {
              renderChemicalList();
            });
          });

          // Keyboard Esc to clear search
          searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && state.searchQuery) {
              state.searchQuery = '';
              searchInput.value = '';
              if (searchClearBtn) searchClearBtn.classList.remove('visible');
              renderChemicalList();
            }
          });
        }

        if (searchClearBtn) {
          searchClearBtn.addEventListener('click', () => {
            state.searchQuery = '';
            if (searchInput) {
              searchInput.value = '';
              searchInput.focus();
            }
            searchClearBtn.classList.remove('visible');
            renderChemicalList();
          });
        }

        // Category Filter Buttons (Toggle davranışı: aktif karta tekrar basılınca filtre kalkar ve 'all' / Tümü'ne döner)
        app.querySelectorAll('.category-card').forEach(card => {
          card.addEventListener('click', () => {
            const clickedCat = card.dataset.cat;
            const categoryGrid = document.getElementById('categoryGrid');

            if (state.category === clickedCat && clickedCat !== 'all') {
              // Zaten seçili olan kategoriye tekrar tıklandı: Filtreyi kaldır ve Tümü'ne dön
              state.category = 'all';
              if (categoryGrid) {
                categoryGrid.scrollTo({ left: 0, behavior: 'smooth' });
              }
            } else {
              state.category = clickedCat;
            }

            app.querySelectorAll('.category-card').forEach(c => {
              c.classList.toggle('active', c.dataset.cat === state.category);
            });
            renderChemicalList();
          });
        });

        // Mouse drag-to-scroll & wheel scroll for horizontal category ribbon on PC
        const categoryGrid = document.getElementById('categoryGrid');
        if (categoryGrid) {
          let isDown = false;
          let startX = 0;
          let scrollLeft = 0;
          let rafId = null;

          const onMouseMove = (e) => {
            if (!isDown) return;
            e.preventDefault();
            const x = e.pageX - categoryGrid.offsetLeft;
            const walk = (x - startX) * 1.8;
            if (rafId) cancelAnimationFrame(rafId);
            rafId = requestAnimationFrame(() => {
              categoryGrid.scrollLeft = scrollLeft - walk;
            });
          };

          const onMouseUp = () => {
            if (!isDown) return;
            isDown = false;
            categoryGrid.style.cursor = '';
            window.removeEventListener('mousemove', onMouseMove);
            window.removeEventListener('mouseup', onMouseUp);
            if (rafId) cancelAnimationFrame(rafId);
          };

          categoryGrid.addEventListener('mousedown', (e) => {
            isDown = true;
            categoryGrid.style.cursor = 'grabbing';
            startX = e.pageX - categoryGrid.offsetLeft;
            scrollLeft = categoryGrid.scrollLeft;
            window.addEventListener('mousemove', onMouseMove, { passive: false });
            window.addEventListener('mouseup', onMouseUp);
          });

          // PC mouse wheel vertical-to-horizontal scrolling (smart boundary checking)
          categoryGrid.addEventListener('wheel', (e) => {
            if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
              const maxScroll = categoryGrid.scrollWidth - categoryGrid.clientWidth;
              if ((e.deltaY > 0 && categoryGrid.scrollLeft < maxScroll) || (e.deltaY < 0 && categoryGrid.scrollLeft > 0)) {
                e.preventDefault();
                categoryGrid.scrollLeft += e.deltaY;
              }
            }
          }, { passive: false });
        }

        // Chemical card clicks (Event delegation on container, 100% reliable)
        const chemicalList = document.getElementById('chemicalList');
        if (chemicalList) {
          chemicalList.addEventListener('click', (e) => {
            const card = e.target.closest('.chemical-card');
            if (card) {
              const chemId = card.dataset.chemicalId;
              openDrawer(chemId, true);
            }
          });
          // Keyboard Enter / Space support for accessibility
          chemicalList.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              const card = e.target.closest('.chemical-card');
              if (card) {
                e.preventDefault();
                const chemId = card.dataset.chemicalId;
                openDrawer(chemId, true);
              }
            }
          });
        }

        // Interactive Logo Animation on Click / Tap / Enter
        const brandLogo = document.getElementById('brandLogoBtn');
        if (brandLogo) {
          const triggerLogoAnim = () => {
            brandLogo.classList.remove('spin');
            void brandLogo.offsetWidth; // Force CSS reflow to retrigger animation
            brandLogo.classList.add('spin');
          };
          brandLogo.addEventListener('click', triggerLogoAnim);
          brandLogo.addEventListener('animationend', () => {
            brandLogo.classList.remove('spin');
          });
          brandLogo.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              triggerLogoAnim();
            }
          });
        }

        // Safe Cache Refresh (Offline-Protected: asla kullanıcıyı internetsiz bırakmaz)
        const refreshBtn = document.getElementById('btnForceRefresh');
        if (refreshBtn) {
          refreshBtn.addEventListener('click', async () => {
            // Çevrimdışı kontrolü: İnternet yokken asla önbelleği silip bozma!
            if (!navigator.onLine) {
              const origHtml = refreshBtn.innerHTML;
              refreshBtn.style.borderColor = 'var(--marine-amber, #f59e0b)';
              refreshBtn.style.color = 'var(--marine-amber, #f59e0b)';
              refreshBtn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:-2px;margin-right:4px;"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>${t('offlineCacheProtected')}`;
              setTimeout(() => {
                refreshBtn.innerHTML = origHtml;
                refreshBtn.style.borderColor = '';
                refreshBtn.style.color = '';
              }, 3200);
              return;
            }

            refreshBtn.classList.add('loading');
            refreshBtn.innerHTML = '...';

            try {
              // 1. Service Worker'a arka planda en güncel halini denetlet
              if ('serviceWorker' in navigator) {
                const reg = await navigator.serviceWorker.getRegistration();
                if (reg) {
                  await reg.update().catch(() => {});
                }
              }

              // 2. Güvenli önbellek yenileme (yeni dosyayı çek, sonra cache'e yaz - eski cache'i ASLA önceden silme)
              if ('caches' in window) {
                const cacheNames = await caches.keys();
                const activeCacheName = cacheNames.find(c => c.startsWith('msds-lite-')) || 'msds-lite-v1.9.0';
                const cache = await caches.open(activeCacheName);
                const urlsToUpdate = ['./', './index.html', './data/chemicals.json', './manifest.json', './icons/qr-code.svg', './icons/qr-code.svg?v=1.9.0'];
                await Promise.allSettled(urlsToUpdate.map(async (url) => {
                  const res = await fetch(url, { cache: 'reload' });
                  if (res && res.ok) {
                    await cache.put(url, res);
                  }
                }));
              }
            } catch (err) {
              console.warn('Cache refresh warning:', err);
            }

            // Sayfayı yeni veriyle güvenle yeniden yükle
            window.location.reload();
          });
        }

        // Backdrop click closes drawer
        document.getElementById('drawerBackdrop')?.addEventListener('click', handleUserClose);

        // Kurumsal Bilgi & QR Modal Event Listeners
        const headerBadge = document.getElementById('headerInstitutionBadge');
        if (headerBadge) {
          headerBadge.addEventListener('click', openExpoModal);
          headerBadge.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              openExpoModal();
            }
          });
        }

        const footerBadge = document.getElementById('footerInstitutionBadge');
        if (footerBadge) {
          footerBadge.addEventListener('click', openExpoModal);
          footerBadge.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              openExpoModal();
            }
          });
        }

        document.getElementById('expoModalBackdrop')?.addEventListener('click', closeExpoModal);

        // SDS Modal Trigger & Backdrop
        document.getElementById('sdsImportTriggerBtn')?.addEventListener('click', openSdsModal);
        document.getElementById('sdsModalBackdrop')?.addEventListener('click', closeSdsModal);
      }

      // Keyboard Esc to close drawer or modal
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          const sdsModal = document.getElementById('sdsModal');
          const expoModal = document.getElementById('expoModal');
          if (sdsModal && sdsModal.classList.contains('open')) {
            closeSdsModal();
          } else if (expoModal && expoModal.classList.contains('open')) {
            closeExpoModal();
          } else {
            handleUserClose();
          }
        }
      });

      // Phone Back Button & Gesture (popstate handles phone back navigation cleanly)
      window.addEventListener('popstate', () => {
        const hash = window.location.hash.replace('#', '');
        const drawer = document.getElementById('detailDrawer');
        const isDrawerOpen = drawer && drawer.classList.contains('open');

        if (hash) {
          openDrawer(hash, false);
        } else if (isDrawerOpen) {
          closeDrawer(false);
        }
      });

      // Initialization
      function init() {
        window.__msdsState = state;
        // 1. Instant Synchronous Boot (0ms render, 100% offline-ready)
        const customChems = loadCustomChemicals();
        state.chemicals = [...customChems, ...fallbackChemicals];
        renderShell();

        // 2. Check initial hash for deep link
        const initialHash = window.location.hash.replace('#', '');
        if (initialHash) {
          openDrawer(initialHash, false);
        }

        // 3. Zarif Turuncu Üst Bar Tamamlanma & Kaybolma
        const bar = document.getElementById('topProgressBar');
        if (bar) {
          setTimeout(() => {
            bar.classList.add('done');
            setTimeout(() => bar.remove(), 350);
          }, 550);
        }

        // 4. Non-blocking background sync with abort timeout (prevents mobile/offline hang)
        if (window.location.protocol !== 'file:') {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 2500);

          fetch('./data/chemicals.json', { signal: controller.signal })
            .then(res => res.ok ? res.json() : null)
            .then(data => {
              clearTimeout(timeoutId);
              if (Array.isArray(data) && data.length > 0) {
                const currentCustoms = loadCustomChemicals();
                const merged = [...currentCustoms];
                data.forEach(item => {
                  if (!merged.some(m => m.id === item.id)) {
                    merged.push(item);
                  }
                });
                state.chemicals = merged;
                renderChemicalList();
              }
            })
            .catch(() => {
              // Silently ignore network aborts/errors, fallbackChemicals is already active
            });
        }
      }

      if (typeof window !== 'undefined') {
        window.__MSDS__ = {
          state,
          escape,
          getL,
          parseSdsText,
          sliceSdsSections,
          validateSdsDocument,
          saveCustomChemical,
          deleteCustomChemical,
          loadCustomChemicals,
          importCustomBackup,
          renderChemicalList,
          renderDrawerContent,
          renderSdsReviewForm,
          openDrawer,
          closeDrawer,
          openSdsModal,
          closeSdsModal
        };
      }

      init();
    })();

    // Service Worker & Auto-Update Handler
    if ('serviceWorker' in navigator && window.location.protocol !== 'file:') {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { scope: './', updateViaCache: 'none' })
          .then((reg) => {
            console.info('MSDS-Lite service worker ready.');
            reg.update().catch(() => {});

            // Auto-check updates on tab visibility or network reconnect
            document.addEventListener('visibilitychange', () => {
              if (document.visibilityState === 'visible') {
                reg.update().catch(() => {});
              }
            });
            window.addEventListener('online', () => {
              reg.update().catch(() => {});
            });

            // When new SW is waiting or installing
            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              if (newWorker) {
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    showUpdateToast();
                  }
                });
              }
            });
          })
          .catch((err) => console.warn('SW failed:', err));

        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            showUpdateToast();
          }
        });
      });
    }

    function showUpdateToast() {
      if (document.getElementById('pwaUpdateToast')) return;
      const toast = document.createElement('div');
      toast.id = 'pwaUpdateToast';
      toast.className = 'pwa-update-toast';
      const lang = (window.__msdsState && window.__msdsState.language) || localStorage.getItem('msds-language') || 'tr';
      const titles = {
        tr: 'Yeni Sürüm Hazır (v1.9.0)',
        en: 'New Version Ready (v1.9.0)',
        de: 'Neue Version Bereit (v1.9.0)',
        fr: 'Nouvelle Version Disponible (v1.9.0)',
        zh: '新版本已就绪 (v1.9.0)',
        ja: '新バージョン準備完了 (v1.9.0)'
      };
      const descs = {
        tr: 'Güncel güvenlik protokollerini yüklemek için dokunun.',
        en: 'Tap to load the latest safety protocols.',
        de: 'Tippen für neueste Sicherheitsprotokolle.',
        fr: 'Appuyer pour charger les derniers protocoles de sécurité.',
        zh: '点击加载最新安全协议。',
        ja: 'タップして最新の安全プロトコルを読み込む。'
      };
      const btns = {
        tr: 'Yenile',
        en: 'Refresh',
        de: 'Neu laden',
        fr: 'Actualiser',
        zh: '刷新',
        ja: '更新'
      };
      toast.innerHTML = `
        <div class="pwa-update-content">
          <span class="pwa-update-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></span>
          <div class="pwa-update-text">
            <strong>${titles[lang] || titles.tr}</strong>
            <p>${descs[lang] || descs.tr}</p>
          </div>
        </div>
        <button type="button" class="pwa-update-btn" id="pwaReloadBtn">${btns[lang] || btns.tr}</button>
      `;
      document.body.appendChild(toast);
      document.getElementById('pwaReloadBtn')?.addEventListener('click', async () => {
        if ('caches' in window) {
          try {
            const keys = await caches.keys();
            await Promise.all(keys.filter(k => k !== 'msds-lite-v1.9.0').map(k => caches.delete(k)));
          } catch (e) {}
        }
        window.location.reload(true);
      });
    }
  </script>
</body>
</html>
