<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="description" content="Tersane ve kompozit atölyesi kimyasal güvenlik rehberi (MSDS-Lite). KKD, ilk yardım ve yangın müdahale talimatları.">
  <title>MSDS-Lite | Kompozit & Tekne İSG</title>
  <!-- Open Graph / LinkedIn / Social Preview -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="MSDS-Lite | Kompozit & Tekne İSG Acil Müdahale Rehberi">
  <meta property="og:description" content="Kompozit tekne imalat atölyeleri için internetsiz (PWA) çalışan, MEK-P ve reçine temaslarında ilk 60 saniyelik acil müdahale rehberi.">
  <meta property="og:url" content="https://erdmsn77.github.io/msds-lite/">
  <meta property="og:image" content="https://erdmsn77.github.io/msds-lite/icons/icon-512.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="MSDS-Lite | Kompozit & Tekne İSG">
  <meta name="twitter:description" content="Kompozit atölyesi kimyasal güvenlik ve acil müdahale rehberi.">
  <meta name="twitter:image" content="https://erdmsn77.github.io/msds-lite/icons/icon-512.png">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f8fafc" id="themeColorMeta">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <script src="vendor/pdf.min.js" defer></script>
  <script>
    (function () {
      try {
        var manual = localStorage.getItem('msds-theme-manual');
        var saved = localStorage.getItem('msds-theme');
        var theme = 'light';
        if (manual === 'true' && (saved === 'dark' || saved === 'light')) {
          theme = saved;
        } else {
          var hour = new Date().getHours();
          if (hour >= 19 || hour < 7) {
            theme = 'dark';
          } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            theme = 'dark';
          }
        }
        if (theme === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
          var m = document.getElementById('themeColorMeta');
          if (m) m.content = '#0b0f17';
        }
      } catch (e) {}
    })();
  </script>

  <style>
    :root {
      color-scheme: light;
      /* Clean, Daylight Workshop Theme (Light / Saha Teması - Default) */
      --bg-base: #f8fafc;
      --bg-surface: #ffffff;
      --bg-card: #ffffff;
      --bg-card-hover: #f1f5f9;
      --bg-active: #e2e8f0;
      --border-subtle: #cbd5e1;
      --border-strong: #94a3b8;
      --border-focus: #ea580c;
      
      --text-main: #0f172a;
      --text-body: #1e293b;
      --text-muted: #475569;
      --text-dim: #64748b;
      
      --card-shadow: 0 1px 3px rgba(15, 23, 42, 0.08), 0 1px 2px rgba(15, 23, 42, 0.05);
      --card-shadow-hover: 0 10px 25px -5px rgba(15, 23, 42, 0.1), 0 8px 10px -6px rgba(15, 23, 42, 0.08);
      --drawer-shadow: -8px 0 36px rgba(15, 23, 42, 0.22);

      --marine-orange: #ea580c;
      --marine-orange-glow: rgba(234, 88, 12, 0.18);
      --marine-amber: #d97706;
      --marine-red: #dc2626;
      --marine-emerald: #059669;
      --marine-cyan: #0284c7;

      --badge-danger-bg: #fef2f2;
      --badge-danger-text: #b91c1c;
      --badge-danger-border: #fca5a5;

      --badge-warning-bg: #fffbeb;
      --badge-warning-text: #b45309;
      --badge-warning-border: #fcd34d;

      --badge-fire-bg: #fff1f2;
      --badge-fire-text: #be123c;
      --badge-fire-border: #fecdd3;

      --badge-health-bg: #eff6ff;
      --badge-health-text: #1d4ed8;
      --badge-health-border: #bfdbfe;

      --badge-env-bg: #ecfdf5;
      --badge-env-text: #047857;
      --badge-env-border: #a7f3d0;

      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --bg-base: #0b0f17;
      --bg-surface: #111827;
      --bg-card: #151e2e;
      --bg-card-hover: #1e293b;
      --bg-active: #283548;
      --border-subtle: #2d3748;
      --border-strong: #475569;
      --border-focus: #f97316;
      
      --text-main: #f8fafc;
      --text-body: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      
      --card-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      --card-shadow-hover: 0 8px 24px rgba(0, 0, 0, 0.5);
      --drawer-shadow: -8px 0 32px rgba(0, 0, 0, 0.75);

      --badge-danger-bg: rgba(220, 38, 38, 0.22);
      --badge-danger-text: #fca5a5;
      --badge-danger-border: rgba(239, 68, 68, 0.45);

      --badge-warning-bg: rgba(217, 119, 6, 0.22);
      --badge-warning-text: #fde68a;
      --badge-warning-border: rgba(245, 158, 11, 0.45);

      --badge-fire-bg: rgba(190, 18, 60, 0.22);
      --badge-fire-text: #fecdd3;
      --badge-fire-border: rgba(244, 63, 94, 0.45);

      --badge-health-bg: rgba(29, 78, 216, 0.22);
      --badge-health-text: #bfdbfe;
      --badge-health-border: rgba(59, 130, 246, 0.45);

      --badge-env-bg: rgba(4, 120, 87, 0.22);
      --badge-env-text: #a7f3d0;
      --badge-env-border: rgba(16, 185, 129, 0.45);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html {
      background-color: var(--bg-base);
      color: var(--text-body);
      min-height: 100%;
      min-height: 100dvh;
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-body);
      font-family: var(--font-sans);
      min-height: 100%;
      min-height: 100dvh;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }

    /* Modern Hardware-Accelerated PC Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border-subtle);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--border-strong);
    }

    .marine-shell {
      max-width: 1240px;
      margin: 0 auto;
      padding: 16px 20px 60px;
    }

    /* Top bar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: #0f172a;
      border: 1px solid rgba(234, 88, 12, 0.45);
      color: #ffffff;
      display: grid;
      place-items: center;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
      flex-shrink: 0;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .brand-icon:hover {
      transform: scale(1.06);
      border-color: var(--marine-orange);
      box-shadow: 0 6px 18px rgba(234, 88, 12, 0.35);
    }
    .brand-icon:active {
      transform: scale(0.95);
    }
    .brand-icon.spin {
      animation: logoSpin 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes logoSpin {
      0% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(1.18) rotate(180deg); filter: drop-shadow(0 0 12px #ea580c); }
      100% { transform: scale(1) rotate(360deg); }
    }
    .brand-eyebrow {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--marine-orange);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--marine-emerald);
      box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.25);
    }
    .brand-title {
      font-size: 22px;
      font-weight: 850;
      letter-spacing: -0.02em;
      line-height: 1.2;
      color: var(--text-main);
    }
    .brand-subtitle {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 1px;
    }

    /* Institutional Badge */
    .brand-institution-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--marine-orange);
      background: rgba(234, 88, 12, 0.08);
      border: 1px solid rgba(234, 88, 12, 0.28);
      border-radius: 6px;
      padding: 3px 8px;
      margin-top: 5px;
      cursor: pointer;
      transition: all 0.15s ease;
      width: fit-content;
      user-select: none;
      line-height: 1.3;
      touch-action: manipulation;
    }
    .brand-institution-badge:hover {
      background: rgba(234, 88, 12, 0.16);
      border-color: var(--marine-orange);
      transform: translateY(-1px);
    }
    .brand-institution-badge:active {
      transform: translateY(0);
    }
    .brand-institution-badge .institution-icon {
      font-size: 12px;
    }
    .brand-institution-badge .institution-arrow {
      font-size: 9.5px;
      opacity: 0.65;
      margin-left: 2px;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Expo / Credits Topbar Button */
    .expo-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(135deg, rgba(234, 88, 12, 0.12), rgba(217, 119, 6, 0.12));
      border: 1px solid rgba(234, 88, 12, 0.38);
      border-radius: 8px;
      padding: 6px 11px;
      font-size: 11.5px;
      font-weight: 750;
      color: var(--marine-orange);
      cursor: pointer;
      box-shadow: var(--card-shadow);
      transition: all 0.15s ease;
      touch-action: manipulation;
      user-select: none;
    }
    .expo-btn:hover {
      border-color: var(--marine-orange);
      background: linear-gradient(135deg, rgba(234, 88, 12, 0.22), rgba(217, 119, 6, 0.22));
      transform: translateY(-1px);
      box-shadow: 0 4px 12px var(--marine-orange-glow);
    }
    .expo-btn:active {
      transform: translateY(0);
    }

    /* Theme Toggle Button */
    .theme-toggle-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 650;
      color: var(--text-main);
      cursor: pointer;
      box-shadow: var(--card-shadow);
      transition: background-color 0.12s ease, border-color 0.12s ease;
    }
    .theme-toggle-btn:hover {
      border-color: var(--marine-orange);
    }

    /* Language Switcher */
    .lang-switch {
      display: flex;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 3px;
      box-shadow: var(--card-shadow);
    }
    .lang-btn {
      border: 0;
      background: transparent;
      color: var(--text-muted);
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 750;
      border-radius: 6px;
      cursor: pointer;
      touch-action: manipulation;
      transition: background-color 0.12s ease, color 0.12s ease;
    }
    .lang-btn.active {
      background: var(--marine-orange);
      color: #ffffff;
      box-shadow: 0 2px 6px var(--marine-orange-glow);
    }

    /* Workshop Controls */
    .controls-panel {
      margin-top: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Search Bar */
    .search-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }
    .search-icon {
      position: absolute;
      left: 14px;
      width: 15px;
      height: 15px;
      stroke: var(--text-muted);
      pointer-events: none;
      opacity: 0.8;
      user-select: none;
    }
    .search-input {
      width: 100%;
      height: 42px;
      padding: 0 40px 0 38px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 550;
      box-shadow: var(--card-shadow);
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
    }
    .search-input::placeholder {
      color: var(--text-muted);
      font-weight: 450;
    }
    .search-input:focus {
      border-color: var(--marine-orange);
      box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.2);
    }
    .search-clear-btn {
      position: absolute;
      right: 10px;
      width: 24px;
      height: 24px;
      display: none;
      align-items: center;
      justify-content: center;
      background: var(--bg-active);
      border: none;
      border-radius: 50%;
      color: var(--text-muted);
      font-size: 11px;
      cursor: pointer;
      transition: background-color 0.12s, color 0.12s;
    }
    .search-clear-btn.visible {
      display: flex;
    }
    .search-clear-btn:hover {
      background: var(--border-subtle);
      color: var(--text-main);
    }

    /* Category Filter Ribbon */
    .category-grid {
      display: flex;
      flex-wrap: nowrap;
      overflow-x: auto;
      gap: 8px;
      padding: 4px 2px 8px;
      scrollbar-width: none;
      -ms-overflow-style: none;
      -webkit-overflow-scrolling: touch;
    }
    .category-grid::-webkit-scrollbar {
      display: none;
    }
    .category-card {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
      white-space: nowrap;
      flex-shrink: 0;
      color: var(--text-body);
      box-shadow: var(--card-shadow);
      font-size: 12px;
      font-weight: 650;
      transition: border-color 0.15s ease, background-color 0.15s ease, transform 0.1s ease;
    }
    .category-card:hover {
      border-color: var(--marine-orange);
    }
    .category-card.active {
      background: var(--marine-orange);
      color: #ffffff;
      border-color: var(--marine-orange);
      box-shadow: 0 4px 12px var(--marine-orange-glow);
    }
    .category-card-count {
      font-size: 10px;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.08);
      color: inherit;
    }
    .category-card.active .category-card-count {
      background: rgba(255, 255, 255, 0.28);
      color: #ffffff;
    }

    .list-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 650;
      color: var(--text-dim);
      padding: 0 4px;
    }

    /* Responsive Grid for all 11 chemicals */
    .chemical-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 14px;
      margin-top: 10px;
    }

    /* Chemical Card (Katman 1: Özet Kart) */
    .chemical-card {
      position: relative;
      display: flex;
      flex-direction: column;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 0;
      text-align: left;
      cursor: pointer;
      overflow: hidden;
      box-shadow: var(--card-shadow);
      touch-action: manipulation;
      transform: translateZ(0);
      will-change: transform, box-shadow;
      contain: layout style paint;
      transition: transform 0.15s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.15s ease, border-color 0.15s ease;
    }
    .chemical-card:hover {
      transform: translateY(-3px) translateZ(0);
      box-shadow: var(--card-shadow-hover);
      border-color: var(--marine-orange);
    }
    .chemical-card:focus-visible {
      outline: 2px solid var(--border-focus);
      outline-offset: 2px;
    }

    .card-risk-topline {
      height: 4px;
      width: 100%;
    }
    .risk-critical { background: var(--marine-red); }
    .risk-high { background: var(--marine-orange); }
    .risk-medium { background: var(--marine-amber); }

    .card-inner {
      padding: 14px 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }

    /* Top Row: Category tag, Signal badge, Risk pill */
    .card-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .card-category-badge {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      background: var(--bg-active);
      padding: 2px 8px;
      border-radius: 6px;
    }
    .card-signals {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .signal-tag {
      font-size: 10px;
      font-weight: 850;
      letter-spacing: 0.04em;
      padding: 2px 8px;
      border-radius: 6px;
      border-width: 1px;
      border-style: solid;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .signal-danger {
      background: var(--badge-danger-bg);
      color: var(--badge-danger-text);
      border-color: var(--badge-danger-border);
    }
    .signal-warning {
      background: var(--badge-warning-bg);
      color: var(--badge-warning-text);
      border-color: var(--badge-warning-border);
    }
    .card-risk-pill {
      font-size: 9px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
      color: #fff;
    }

    /* Title & CAS */
    .card-title {
      font-size: 17px;
      font-weight: 850;
      color: var(--text-main);
      line-height: 1.25;
      letter-spacing: -0.01em;
    }
    .card-cas-line {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-muted);
    }
    .cas-badge {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      background: var(--bg-active);
      padding: 1px 6px;
      border-radius: 4px;
      color: var(--text-main);
    }
    .chem-subname {
      color: var(--text-dim);
    }

    /* GHS Diamonds & Hazard Statement */
    .card-hazard-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      background: var(--bg-base);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 8px 10px;
    }
    .card-ghs-diamonds {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }
    .ghs-diamond-mini {
      width: 26px;
      height: 26px;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.15));
    }
    .ghs-diamond-large {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
    }
    .card-hazard-text {
      font-size: 11px;
      font-weight: 550;
      line-height: 1.4;
      color: var(--text-body);
      flex: 1;
    }

    /* Three Color-Coded Emergency Badges: Yangın (Kırmızı), Sağlık (Mavi), Çevre (Yeşil) */
    .card-emergency-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .badge-pill {
      font-size: 10.5px;
      font-weight: 650;
      padding: 3px 8px;
      border-radius: 6px;
      border-width: 1px;
      border-style: solid;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
    }
    .badge-fire {
      background: var(--badge-fire-bg);
      color: var(--badge-fire-text);
      border-color: var(--badge-fire-border);
    }
    .badge-health {
      background: var(--badge-health-bg);
      color: var(--badge-health-text);
      border-color: var(--badge-health-border);
    }
    .badge-env {
      background: var(--badge-env-bg);
      color: var(--badge-env-text);
      border-color: var(--badge-env-border);
    }

    /* Card Footer: Timer info + Action CTA */
    .card-footer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
      padding-top: 8px;
      border-top: 1px solid var(--border-subtle);
    }
    .card-timer-badge {
      font-size: 11px;
      font-weight: 750;
      color: var(--marine-orange);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .card-action-cta {
      font-size: 11.5px;
      font-weight: 750;
      color: var(--text-main);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: color 0.12s ease;
    }
    .chemical-card:hover .card-action-cta {
      color: var(--marine-orange);
    }

    /* Empty State */
    .empty-state {
      padding: 48px 16px;
      text-align: center;
      background: var(--bg-card);
      border: 1px dashed var(--border-subtle);
      border-radius: 12px;
      grid-column: 1 / -1;
    }
    .empty-title {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }
    .empty-btn {
      padding: 8px 16px;
      background: var(--marine-orange);
      color: #fff;
      border: 0;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Drawer Modal (Katman 2: Hızlı Acil Durum Paneli) */
    .drawer-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(11, 15, 23, 0.72);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateZ(0);
      transition: opacity 0.2s ease, visibility 0.2s ease;
      z-index: 99;
    }
    .drawer-backdrop.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      max-width: 580px;
      background: var(--bg-surface);
      color: var(--text-body);
      box-shadow: var(--drawer-shadow);
      z-index: 100;
      transform: translateX(100%);
      visibility: hidden;
      will-change: transform;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.25s;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      touch-action: pan-y;
    }
    .drawer.open {
      transform: translateX(0);
      visibility: visible;
    }

    .drawer-header {
      padding: 16px 20px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-subtle);
      flex-shrink: 0;
    }
    .drawer-header-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    .drawer-category-tag {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--marine-orange);
      margin-bottom: 4px;
      display: inline-block;
    }
    .drawer-title {
      font-size: 20px;
      font-weight: 850;
      color: var(--text-main);
      line-height: 1.2;
    }
    .drawer-chemical-name {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .drawer-close {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      background: var(--bg-base);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      font-size: 18px;
      display: grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background-color 0.12s ease;
    }
    .drawer-close:hover {
      background: var(--bg-active);
    }

    /* Quick jump navigation inside drawer */
    .drawer-nav-pills {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 10px 20px;
      background: var(--bg-base);
      border-bottom: 1px solid var(--border-subtle);
      flex-shrink: 0;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x;
    }
    .drawer-nav-pills::-webkit-scrollbar { display: none; }
    .drawer-nav-pill {
      border: 1px solid var(--border-subtle);
      background: var(--bg-surface);
      color: var(--text-body);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      text-decoration: none;
    }
    .drawer-nav-pill:hover {
      border-color: var(--marine-orange);
      color: var(--marine-orange);
    }

    .drawer-body {
      padding: 16px 20px 48px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex: 1;
    }

    /* Incompatibility banner */
    .incompatibility-box {
      border: 1.5px solid var(--marine-red);
      background: rgba(220, 38, 38, 0.08);
      border-radius: 10px;
      padding: 14px;
    }
    .incompatibility-box.warning-box {
      border-color: var(--marine-amber);
      background: rgba(217, 119, 6, 0.08);
    }
    .incompatibility-header {
      font-size: 11px;
      font-weight: 850;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--marine-red);
      margin-bottom: 4px;
    }
    .incompatibility-box.warning-box .incompatibility-header {
      color: var(--marine-amber);
    }
    .incompatibility-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 6px;
    }
    .incompatibility-text {
      font-size: 12px;
      line-height: 1.5;
      color: var(--text-body);
    }
    .incompatibility-source {
      font-size: 10px;
      color: var(--text-dim);
      margin-top: 6px;
    }

    /* High-Visibility Emergency Rinse Banner (Replaces Timer Console) */
    .emergency-time-banner {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(220, 38, 38, 0.08);
      border: 1.5px solid var(--marine-red);
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 12px;
      color: var(--text-main);
    }
    .emergency-time-icon {
      font-size: 26px;
      flex-shrink: 0;
    }
    .emergency-time-title {
      font-size: 12.5px;
      font-weight: 850;
      color: var(--marine-red);
      letter-spacing: 0.02em;
    }
    .emergency-time-desc {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
      line-height: 1.4;
    }

    /* Eyewash Technique & Safety Protocol Box */
    .eyewash-guide-box {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-left: 3.5px solid var(--marine-cyan);
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 14px;
    }
    .eyewash-guide-title {
      font-size: 11px;
      font-weight: 850;
      letter-spacing: 0.05em;
      color: var(--marine-cyan);
      margin-bottom: 8px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .eyewash-guide-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .eyewash-guide-item {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      font-size: 11.5px;
      line-height: 1.4;
    }
    .eyewash-guide-item strong {
      color: var(--text-main);
      display: block;
      font-size: 11.5px;
      margin-bottom: 1px;
    }
    .eyewash-guide-item p {
      color: var(--text-muted);
      margin: 0;
      font-size: 11px;
      line-height: 1.35;
    }
    .eyewash-guide-num {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--marine-cyan);
      color: #0b0f17;
      font-size: 11px;
      font-weight: 850;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }

    /* Section Cards inside Drawer */
    .drawer-section {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 14px;
      box-shadow: var(--card-shadow);
    }
    .section-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 850;
      color: var(--text-main);
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .section-icon {
      font-size: 16px;
    }

    /* Sub blocks */
    .detail-item-block {
      margin-bottom: 10px;
    }
    .detail-item-block:last-child {
      margin-bottom: 0;
    }
    .detail-item-label {
      font-size: 11px;
      font-weight: 750;
      color: var(--text-muted);
      margin-bottom: 2px;
    }
    .detail-item-val {
      font-size: 12.5px;
      color: var(--text-body);
      line-height: 1.45;
    }

    /* Glove list */
    .glove-list {
      display: flex;
      gap: 8px;
      margin: 6px 0 10px;
    }
    .glove-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 6px 4px;
      background: var(--bg-base);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      text-align: center;
    }
    .glove-name {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 2px;
    }
    .glove-badge {
      font-size: 10px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .glove-badge.safe {
      background: var(--badge-env-bg);
      color: var(--badge-env-text);
    }
    .glove-badge.unsafe {
      background: var(--badge-danger-bg);
      color: var(--badge-danger-text);
    }
    .glove-warning-box {
      font-size: 11px;
      color: var(--marine-red);
      background: rgba(220, 38, 38, 0.08);
      border-radius: 6px;
      padding: 8px;
      line-height: 1.4;
    }

    /* GHS cards grid in drawer */
    .ghs-cards-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .ghs-card-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-base);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 8px 10px;
    }
    .ghs-card-meta {
      flex: 1;
    }
    .ghs-card-code {
      font-size: 10px;
      font-weight: 800;
      color: var(--marine-red);
    }
    .ghs-card-name {
      font-size: 12px;
      font-weight: 750;
      color: var(--text-main);
    }
    .ghs-card-desc {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* Footer */
    .marine-footer {
      margin-top: 40px;
      padding-top: 16px;
      border-top: 1px solid var(--border-subtle);
      font-size: 11px;
      color: var(--text-dim);
      text-align: center;
      line-height: 1.5;
    }
    .footer-meta {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .version-tag {
      font-size: 10px;
      font-family: var(--font-mono);
      color: var(--text-muted);
      background: var(--bg-surface);
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid var(--border-subtle);
    }
    .footer-refresh-btn {
      font-size: 11px;
      font-family: var(--font-sans);
      color: var(--marine-cyan);
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 4px 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.15s ease;
    }
    .footer-refresh-btn:hover {
      border-color: var(--marine-cyan);
      background: var(--bg-surface);
    }
    .footer-refresh-btn.loading {
      opacity: 0.6;
      pointer-events: none;
    }

    .version-pill {
      font-size: 9px;
      font-weight: 750;
      font-family: var(--font-mono);
      background: rgba(249, 115, 22, 0.15);
      color: #fb923c;
      padding: 1px 6px;
      border-radius: 999px;
      border: 1px solid rgba(249, 115, 22, 0.35);
      letter-spacing: 0.03em;
      display: inline-block;
    }

    /* PWA Update Banner / Toast */
    .pwa-update-toast {
      position: fixed;
      bottom: max(16px, env(safe-area-inset-bottom, 16px));
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 460px;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(249, 115, 22, 0.55);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), 0 0 20px rgba(249, 115, 22, 0.25);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      z-index: 10000;
      animation: toastSlideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes toastSlideUp {
      from { opacity: 0; transform: translate(-50%, 20px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }
    .pwa-update-content {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .pwa-update-icon {
      font-size: 22px;
      flex-shrink: 0;
    }
    .pwa-update-text {
      min-width: 0;
    }
    .pwa-update-text strong {
      display: block;
      font-size: 13px;
      color: #f8fafc;
      font-weight: 750;
      line-height: 1.25;
    }
    .pwa-update-text p {
      margin: 2px 0 0;
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.2;
    }
    .pwa-update-btn {
      background: #f97316;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 750;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s;
    }
    .pwa-update-btn:active {
      transform: scale(0.96);
      background: #ea580c;
    }

    /* Footer Institutional Block */
    .footer-institution-block {
      margin-top: 16px;
      padding: 12px 14px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      font-size: 11px;
      line-height: 1.5;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s ease;
      touch-action: manipulation;
      user-select: none;
    }
    .footer-institution-block:hover {
      border-color: var(--marine-orange);
      background: rgba(234, 88, 12, 0.04);
      transform: translateY(-1px);
    }
    .footer-inst-title {
      font-weight: 800;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .footer-inst-dept {
      color: var(--text-muted);
      margin-top: 2px;
      font-size: 10.5px;
    }
    .footer-inst-credits {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
      flex-wrap: wrap;
      color: var(--text-dim);
      font-size: 10.5px;
    }
    .footer-expo-trigger {
      background: transparent;
      border: none;
      color: var(--marine-orange);
      font-weight: 750;
      font-size: 11px;
      cursor: pointer;
      text-decoration: underline;
      padding: 0;
      touch-action: manipulation;
    }
    .footer-expo-trigger:hover {
      color: #c2410c;
    }

    /* Fuar & Proje Künyesi Modal (Expo Modal) */
    .expo-modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(11, 15, 23, 0.72);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateZ(0);
      transition: opacity 0.22s ease, visibility 0.22s ease;
      z-index: 1000;
    }
    .expo-modal-backdrop.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }
    .expo-modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -46%) scale(0.96);
      width: calc(100% - 32px);
      max-width: 550px;
      max-height: calc(100vh - 44px);
      background: var(--bg-surface);
      color: var(--text-body);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
      z-index: 1001;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      will-change: transform, opacity;
      transition: opacity 0.22s ease, transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.22s;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .expo-modal.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
    }
    .expo-modal-header {
      padding: 14px 18px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
    }
    .expo-modal-title-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .expo-modal-icon {
      font-size: 22px;
      flex-shrink: 0;
    }
    .expo-modal-title {
      font-size: 14.5px;
      font-weight: 850;
      color: var(--text-main);
      line-height: 1.25;
    }
    .expo-modal-subtitle {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 1px;
    }
    .expo-modal-close-btn {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      font-size: 17px;
      width: 30px;
      height: 30px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }
    .expo-modal-close-btn:hover {
      border-color: var(--marine-red);
      color: var(--marine-red);
      background: rgba(220, 38, 38, 0.08);
    }
    .expo-modal-body {
      padding: 16px 18px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .expo-inst-card {
      background: linear-gradient(135deg, rgba(234, 88, 12, 0.08), rgba(2, 132, 199, 0.06));
      border: 1px solid rgba(234, 88, 12, 0.28);
      border-radius: 12px;
      padding: 12px 14px;
      text-align: center;
    }
    .expo-inst-badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 9.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--marine-orange);
      background: rgba(234, 88, 12, 0.12);
      padding: 2px 7px;
      border-radius: 999px;
      margin-bottom: 5px;
    }
    .expo-inst-h1 {
      font-size: 13.5px;
      font-weight: 850;
      color: var(--text-main);
      line-height: 1.35;
    }
    .expo-inst-h2 {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: 3px;
      line-height: 1.4;
    }
    .expo-qr-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      gap: 14px;
      align-items: center;
      box-shadow: var(--card-shadow);
    }
    .expo-qr-box {
      background: #0b0f17;
      padding: 6px;
      border-radius: 12px;
      border: 1px solid rgba(234, 88, 12, 0.35);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
      flex-shrink: 0;
      display: grid;
      place-items: center;
    }
    .expo-qr-img {
      display: block;
      width: 120px;
      height: 120px;
      border-radius: 6px;
    }
    .expo-qr-info {
      flex: 1;
      min-width: 0;
    }
    .expo-qr-title {
      font-size: 12px;
      font-weight: 850;
      color: var(--text-main);
      margin-bottom: 3px;
    }
    .expo-qr-desc {
      font-size: 10.5px;
      color: var(--text-muted);
      line-height: 1.35;
      margin: 0 0 8px;
    }
    .expo-url-box {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .expo-url-link {
      font-size: 10.5px;
      font-family: var(--font-mono);
      color: var(--marine-cyan);
      text-decoration: none;
      word-break: break-all;
      font-weight: 600;
    }
    .expo-url-link:hover {
      text-decoration: underline;
    }
    .expo-copy-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 4px 9px;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.15s ease;
      width: fit-content;
    }
    .expo-copy-btn:hover {
      border-color: var(--marine-orange);
      color: var(--marine-orange);
    }
    .expo-credits-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .expo-credit-cell {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 9px 11px;
    }
    .expo-credit-label {
      font-size: 9.5px;
      font-weight: 750;
      text-transform: uppercase;

    /* Zarif Turuncu Üst Yükleme Çubuğu (Sleek Top Progress Bar) */
    .top-progress-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 3.5px;
      z-index: 99999;
      pointer-events: none;
      background: transparent;
      overflow: hidden;
      transition: opacity 0.3s ease-out;
    }
    .top-progress-bar.done {
      opacity: 0;
    }
    .top-progress-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #ea580c 0%, #f97316 60%, #dc2626 100%);
      box-shadow: 0 0 12px rgba(234, 88, 12, 0.9);
      border-radius: 0 3px 3px 0;
      transform: translateX(-100%);
      animation: topProgressAnim 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes topProgressAnim {
      0% { transform: translateX(-100%); }
      60% { transform: translateX(-15%); }
      100% { transform: translateX(0%); }
    }

    /* SDS Modal */
    .sds-modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(11, 15, 23, 0.72);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateZ(0);
      transition: opacity 0.22s ease, visibility 0.22s ease;
      z-index: 1000;
    }
    .sds-modal-backdrop.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }
    .sds-modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -46%) scale(0.96);
      width: calc(100% - 32px);
      max-width: 620px;
      max-height: calc(100vh - 40px);
      background: var(--bg-surface);
      color: var(--text-body);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
      z-index: 1001;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      will-change: transform, opacity;
      transition: opacity 0.22s ease, transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.22s;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sds-modal.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
    }

    }

    .sds-modal-title {

      function detectInitialTheme() {
        try {
          const manual = localStorage.getItem('msds-theme-manual');
          const saved = localStorage.getItem('msds-theme');
          if (manual === 'true' && (saved === 'dark' || saved === 'light')) {
            return saved;
          }
          const hour = new Date().getHours();
          if (hour >= 19 || hour < 7) {
            return 'dark';
          }
          if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            return 'dark';
          }
          return 'light';
        } catch (e) {
          return 'light';
        }
      }

      const state = {
        chemicals: [],
        language: localStorage.getItem('msds-language') || 'tr',
        theme: detectInitialTheme(),
        category: 'all',
        searchQuery: '',
        selectedChemical: null
      };

      const t = (key) => (translations[state.language] && translations[state.language][key]) || key;
      const escape = (val) => (val == null ? '' : String(val)).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[c]));
      const getL = (val) => (typeof val === 'object' && val !== null && !Array.isArray(val)) ? (val[state.language] ?? val.tr ?? '') : (val ?? '');

      function renderGhsDiamond(code, sizeClass = 'ghs-diamond-mini') {
        const meta = GHS_METADATA[code] || GHS_METADATA.GHS07;
        return `<svg viewBox="0 0 100 100" class="${sizeClass}" aria-label="${escape(code)}"><polygon points="50,6 94,50 50,94 6,50" fill="#ffffff" stroke="#ef4444" stroke-width="7" stroke-linejoin="round"/>${meta.svg}</svg>`;
      }

      function normStr(str) {
        return String(str || '')
          .replace(/İ/g, 'i')
          .replace(/I/g, 'i')
          .replace(/ı/g, 'i')
          .toLocaleLowerCase('tr-TR')
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '');
      }

      function getFilteredChemicals() {
        const q = normStr(state.searchQuery).trim();
        return state.chemicals.filter((chem) => {
          const matchCat = state.category === 'all' || (state.category === 'custom' ? !!chem.is_custom : chem.category === state.category);
          if (!matchCat) return false;
          if (!q) return true;

          const nameTr = normStr(chem.name?.tr || chem.name);
          const nameEn = normStr(chem.name?.en);
          const nameDe = normStr(chem.name?.de);
          const chemNameTr = normStr(chem.chemical_name?.tr || chem.chemical_name);
          const chemNameEn = normStr(chem.chemical_name?.en);
          const chemNameDe = normStr(chem.chemical_name?.de);
          const cas = normStr(chem.cas);
          const category = normStr(chem.category);
          const ghs = normStr((chem.ghs_codes || []).join(' '));

          return nameTr.includes(q) ||
                 nameEn.includes(q) ||
                 nameDe.includes(q) ||
                 chemNameTr.includes(q) ||
                 chemNameEn.includes(q) ||
                 chemNameDe.includes(q) ||
                 cas.includes(q) ||
                 category.includes(q) ||
                 ghs.includes(q);
        });
      }

      // Fast, targeted list renderer (Only updates list container)
      function renderChemicalList() {
        const listEl = document.getElementById('chemicalList');
        const countEl = document.getElementById('resultsCount');
        if (!listEl) return;

        const filtered = getFilteredChemicals();
        if (countEl) countEl.textContent = `${filtered.length} ${t('records')}`;

        if (filtered.length === 0) {
          listEl.innerHTML = `
            <div class="empty-state">
              <p class="empty-title">${t('noResults')}</p>
              <button type="button" class="empty-btn" id="emptyResetBtn">${t('clearSearch')}</button>
            </div>
          `;
          document.getElementById('emptyResetBtn')?.addEventListener('click', () => {
            state.category = 'all';
            state.searchQuery = '';
            const searchInput = document.getElementById('searchInput');
            if (searchInput) searchInput.value = '';
            const searchClearBtn = document.getElementById('searchClearBtn');
            if (searchClearBtn) searchClearBtn.classList.remove('visible');
            document.querySelectorAll('.category-card').forEach(c => {
              c.classList.toggle('active', c.dataset.cat === 'all');
            });
            const categoryGrid = document.getElementById('categoryGrid');
            if (categoryGrid) {
              categoryGrid.scrollTo({ left: 0, behavior: 'smooth' });
            }
            renderChemicalList();
          });
          return;
        }

        listEl.innerHTML = filtered.map((chem) => {
          const riskClass = chem.risk_level === 'KRİTİK' ? 'risk-critical' : chem.risk_level === 'YÜKSEK' ? 'risk-high' : 'risk-medium';
          const riskText = chem.risk_level === 'KRİTİK' ? t('riskCritical') : chem.risk_level === 'YÜKSEK' ? t('riskHigh') : t('riskMedium');
          const catLabel = (CATEGORIES[chem.category] && CATEGORIES[chem.category][state.language]) || chem.category;
          const ghsMiniHtml = (chem.ghs_codes || []).map(c => renderGhsDiamond(c, 'ghs-diamond-mini')).join('');

          const isDanger = (chem.signal_word && (chem.signal_word.tr === 'TEHLİKE' || chem.signal_word === 'TEHLİKE'));
          const signalClass = isDanger ? 'signal-danger' : 'signal-warning';
          const signalIconSvg = isDanger 
            ? '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:-1px;margin-right:3px;"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>'
            : '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:-1px;margin-right:3px;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>';

          return `
            <article class="chemical-card" data-chemical-id="${escape(chem.id)}" role="button" tabindex="0" aria-label="${escape(getL(chem.name))}">
              <div class="card-risk-topline ${riskClass}"></div>
              <div class="card-inner">
                <div class="card-top-row">
                  <div style="display:flex;align-items:center;gap:6px;">
                    <span class="card-category-badge">${escape(catLabel)}</span>
                    ${chem.is_custom ? `<span style="font-size:9.5px;font-weight:750;letter-spacing:0.04em;padding:2px 7px;border-radius:4px;background:rgba(235,94,40,0.14);color:var(--marine-orange);border:1px solid rgba(235,94,40,0.3);">${t('customTag')}</span>` : ''}
                  </div>
                  <div class="card-signals">
                    <span class="signal-tag ${signalClass}">${signalIconSvg}${escape(getL(chem.signal_word))}</span>
                    <span class="card-risk-pill ${riskClass}">${escape(riskText)}</span>
                  </div>
                </div>

                <div>
                  <h2 class="card-title">${escape(getL(chem.name))}</h2>
                  <div class="card-cas-line">
                    <span class="cas-badge">CAS: ${escape(chem.cas || '—')}</span>
                    <span class="chem-subname">${escape(getL(chem.chemical_name))}</span>
                  </div>
                </div>

                <div class="card-hazard-row">
                  <div class="card-ghs-diamonds">${ghsMiniHtml}</div>
                  <div class="card-hazard-text">${escape(getL(chem.hazard_statement) || (chem.signal_word ? `${getL(chem.signal_word)} (${(chem.ghs_codes || []).join(', ')})` : ''))}</div>
                </div>

                ${(() => {
                  const fireBadge = getL(chem.badges?.fire);
                  const healthBadge = getL(chem.badges?.health);
                  const envBadge = getL(chem.badges?.environment);
                  const pills = [
                    fireBadge ? `<span class="badge-pill badge-fire">${escape(fireBadge)}</span>` : '',
                    healthBadge ? `<span class="badge-pill badge-health">${escape(healthBadge)}</span>` : '',
                    envBadge ? `<span class="badge-pill badge-env">${escape(envBadge)}</span>` : ''
                  ].filter(Boolean);
                  return pills.length > 0 ? `<div class="card-emergency-badges">${pills.join('')}</div>` : '';
                })()}

                <div class="card-footer-row">
                  <span class="card-timer-badge"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:-1px;margin-right:4px;"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>${t('atLeast')} ${chem.emergency_timer_min || 15} ${t('minutes')} ${t('emergencyWashShort')}</span>
                  <span class="card-action-cta">${t('viewDetails')} →</span>
                </div>
              </div>
            </article>
          `;
        }).join('');
      }

      function openDrawer(chemicalId, shouldPushHistory = true) {
        const chem = state.chemicals.find(c => c.id === chemicalId);
        if (!chem) return;

        state.selectedChemical = chem;

        // Push history state so phone back button/gesture returns to main menu instead of closing app
        if (shouldPushHistory && window.location.hash !== '#' + chem.id) {
          history.pushState({ drawerOpen: true, chemId: chem.id }, '', '#' + chem.id);
        }

        const drawer = document.getElementById('detailDrawer');
        const backdrop = document.getElementById('drawerBackdrop');
        if (drawer && backdrop) {
          drawer.innerHTML = renderDrawerContent(chem);
          drawer.classList.add('open');
          drawer.setAttribute('aria-hidden', 'false');
          backdrop.classList.add('open');
          bindDrawerEvents();
        }
      }

      function closeDrawer(syncHistory = false) {
        const drawer = document.getElementById('detailDrawer');
        const backdrop = document.getElementById('drawerBackdrop');
        if (drawer) {
          drawer.classList.remove('open');
          drawer.setAttribute('aria-hidden', 'true');
        }
        if (backdrop) {
          backdrop.classList.remove('open');
        }
        if (syncHistory && window.location.hash) {
          try {
            history.replaceState(null, '', window.location.pathname + window.location.search);
          } catch (e) {}
        }
      }

      // Safe user-initiated close (Backdrop, Close Button or Swipe)
      function handleUserClose() {
        if (window.location.hash) {
          // Pops history naturally, triggering popstate which closes drawer cleanly
          history.back();
        } else {
          closeDrawer(true);
        }
      }

      function bindDrawerEvents() {
        const drawer = document.getElementById('detailDrawer');
        if (!drawer) return;

        drawer.querySelector('#drawerCloseBtn')?.addEventListener('click', handleUserClose);
        drawer.querySelector('#sdsEditBtn')?.addEventListener('click', (e) => {
          const id = e.currentTarget.dataset.id;
          const chem = state.chemicals.find(c => c.id === id);
          if (chem) {
            handleUserClose();
            setTimeout(() => {
              openSdsModal();
              renderSdsReviewForm(chem, true);
            }, 120);
          }
        });
        drawer.querySelector('#sdsDeleteBtn')?.addEventListener('click', (e) => {
          const id = e.currentTarget.dataset.id;
          if (id) deleteCustomChemical(id);
        });

        // Smooth scroll for nav pills inside drawer
        drawer.querySelectorAll('.drawer-nav-pill').forEach(pill => {
          pill.addEventListener('click', (e) => {
            e.preventDefault();
            const targetId = pill.getAttribute('href').replace('#', '');
            const targetEl = drawer.querySelector('#' + targetId);
            if (targetEl) {
              targetEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
          });
        });

        // Swipe-to-dismiss gesture on mobile (yalnızca sol kenardan veya başlıktan çekildiğinde kapatır)
        let touchStartX = 0;
        let touchStartY = 0;
        let touchCurrentX = 0;
        let canSwipeDismiss = false;

        drawer.ontouchstart = (e) => {
          // Yatay kaydırılan menü çubuğu (pills), buton veya form alanlarında asla kapatma tetikleme
          if (e.target.closest('.drawer-nav-pills') || e.target.closest('button') || e.target.closest('input')) {
            canSwipeDismiss = false;
            return;
          }

          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
          touchCurrentX = touchStartX;

          // Yalnızca ekranın sol kenarından çekiliyorsa (iOS/Android native geri alanı: ilk 45px)
          // VEYA üst başlıktan (drawer-header) çekiliyorsa izin ver. Ekranın ortasındaki kaydırmalarda kapatma.
          const isEdgeSwipe = touchStartX <= 45;
          const isHeaderDrag = !!e.target.closest('.drawer-header');

          canSwipeDismiss = isEdgeSwipe || isHeaderDrag;
        };

        drawer.ontouchmove = (e) => {
          if (!canSwipeDismiss) return;
          touchCurrentX = e.touches[0].clientX;
        };

        drawer.ontouchend = (e) => {
          if (!canSwipeDismiss) return;
          const deltaX = touchCurrentX - touchStartX;
          const deltaY = Math.abs((e.changedTouches[0]?.clientY || touchStartY) - touchStartY);

          // Yalnızca sağa doğru kararlı çekme varsa (en az 80px ve yatay hareket dikey hareketten belirgin biçimde fazlaysa)
          if (deltaX > 80 && deltaX > deltaY * 1.4) {
            handleUserClose();
          }
          canSwipeDismiss = false;
        };
      }

      function importCustomBackup(file, onComplete) {
        if (!file) return;
        if (file.size > 2 * 1024 * 1024) {
          if (onComplete) onComplete(new Error(state.language === 'tr' ? 'Yedek dosyası çok büyük (maksimum 2MB).' : 'Backup file too large (maximum 2MB).'), 0);
          return;
        }
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const rawParsed = JSON.parse(e.target.result);
            if (!Array.isArray(rawParsed)) {
              throw new Error(state.language === 'tr' ? 'Geçersiz yedek formatı: Dizi bekleniyor.' : 'Invalid backup format: Array expected.');
            }
            if (rawParsed.length > 100) {
              throw new Error(state.language === 'tr' ? 'Yedek dosyasında en fazla 100 kayıt bulunabilir.' : 'Backup file cannot exceed 100 records.');
            }
            let addedCount = 0;
            const existing = loadCustomChemicals();
            const existingIds = new Set(existing.map(c => c.id));

            for (const item of rawParsed) {
              if (item && typeof item === 'object' && !Array.isArray(item)) {
                // Neutralize Prototype Pollution
                delete item['__proto__'];
                delete item['constructor'];
                delete item['prototype'];

                // Sanitize and validate ID
                const rawId = String(item.id || '').trim().replace(/[^a-zA-Z0-9_-]/g, '-').slice(0, 64);
                if (!rawId || rawId.length < 2) continue;

                // Validate Name
                const rawName = typeof item.name === 'object' ? getL(item.name) : String(item.name || '').trim();
                if (!rawName) continue;

                // Strip unverified or non-http source URLs
                if (item.source_url && !/^https?:\/\//i.test(item.source_url)) {
                  delete item.source_url;
                }

                // Sanitize GHS codes
                if (Array.isArray(item.ghs_codes)) {
                  item.ghs_codes = item.ghs_codes.filter(c => typeof c === 'string' && /^GHS0[1-9]$/i.test(c)).map(c => c.toUpperCase());
                } else {
                  item.ghs_codes = ['GHS07'];
                }

                item.id = rawId;
                item.is_custom = true;
                item.verified_at = item.verified_at || new Date().toISOString().split('T')[0];

                if (!existingIds.has(item.id)) {
                  existing.push(item);
                  existingIds.add(item.id);
                  addedCount++;
                }
              }
            }
            try {
              localStorage.setItem('msds-custom-chemicals', JSON.stringify(existing));
            } catch (storageErr) {
              throw new Error(state.language === 'tr' ? 'Tarayıcı depolama alanı yetersiz (Kota aşıldı).' : 'Browser storage quota exceeded.');
            }
            const base = (state.chemicals || fallbackChemicals).filter(c => !existing.some(e => e.id === c.id));
            state.chemicals = [...existing, ...base];
            renderShell();
            renderChemicalList();
            if (onComplete) onComplete(null, addedCount);
          } catch (err) {
            console.warn('importCustomBackup error:', err);
            if (onComplete) onComplete(err, 0);
          }
        };
        reader.readAsText(file);
      }

      // REACH / GHS Standard Slicer (16 Sections)
      function sliceSdsSections(fullText) {
        if (!fullText || typeof fullText !== 'string') return {};
        const clean = fullText.replace(/\r\n/g, '\n');
        const sectionHeaderRegex = /(?:(?:^|\n)\s*(?:(?:B[ÖO]L[ÜU]M|SECTION|ABSCHNITT)\s*([0-9]{1,2})|(?:([0-9]{1,2})\s*[\.\:\-]\s*(?:MADDEN[Iİ]N|MADDEN[Iİ]|ZARARLILIK|B[Iİ]LE[SŞ][Iİ]M|[Iİ]LK\s*YARDIM|YANGINLA|KAZA\s*SONUCU|ELLE[CÇ]LEME|KULLANMA|MARUZ[Iİ]YET|F[Iİ]Z[Iİ]KSEL|KARARLILIK|TOKS[Iİ]KOLOJ[Iİ]K|EKOLOJ[Iİ]K|BERTARAF|TA[SŞ]IMACILIK|MEVZUAT|D[Iİ][GĞ]ER|IDENTIFICATION|HAZARDS?|COMPOSITION|FIRST[\s\-]*AID|FIRE[\s\-]*FIGHTING|ACCIDENTAL|HANDLING|EXPOSURE|PHYSICAL|STABILITY|TOXICOLOGICAL|ECOLOGICAL|DISPOSAL|TRANSPORT|REGULATORY|OTHER|BEZEICHNUNG|MÖGLICHE\s*GEFAHREN|ZUSAMMENSETZUNG|ERSTE[\s\-]*HILFE|BRANDBEKÄMPFUNG|HANDHABUNG|BEGRENZUNG|PHYSIKALISCHE|STABILITÄT|TOXIKOLOGISCHE|UMWELTBEZOGENE|HINWEISE\s*ZUR\s*ENTSORGUNG|RECHTSVORSCHRIFTEN|SONSTIGE)))[\s\:\.\-][^\n]*)/gi;

        const matches = [];
        let m;
        while ((m = sectionHeaderRegex.exec(clean)) !== null) {
          const secNum = parseInt(m[1] || m[2], 10);
          if (secNum >= 1 && secNum <= 16) {
            matches.push({ num: secNum, index: m.index, matchLen: m[0].length });
          }
        }

        const sections = {};
        for (let i = 0; i < matches.length; i++) {
          const cur = matches[i];
          const startIndex = cur.index + cur.matchLen;
          const nextMatch = matches[i + 1];
          const endIndex = nextMatch ? nextMatch.index : clean.length;
          let textSlice = clean.substring(startIndex, endIndex).trim();
          // Clean running headers
          textSlice = textSlice.split(/(?:GUVENLIK BILGI FORMU|SAFETY DATA SHEET|SICHERHEITSDATENBLATT)[\s\S]*?(?:Sayfa|Page|Seite)\s*\d/i)[0].trim();
          if (!sections[cur.num] || textSlice.length > sections[cur.num].length) {
            sections[cur.num] = textSlice;
          }
        }
        return sections;
      }

      function validateSdsDocument(sections) {
        const detectedKeys = Object.keys(sections);
        if (detectedKeys.length < 3 || !sections[1]) {
          return { isValid: false, count: detectedKeys.length, detected: detectedKeys };
        }
        return { isValid: true, count: detectedKeys.length, detected: detectedKeys };
      }

      function inferCategory(text) {
        const t = (text || '').toLowerCase();
        if (t.includes('peroksit') || t.includes('peroxide') || t.includes('mek-p') || t.includes('butanox')) return 'peroksit';
        if (t.includes('sertleştirici') || t.includes('sertlestirici') || t.includes('hardener') || t.includes('härter') || t.includes('haerter') || t.includes('amin') || t.includes('ipda')) return 'sertlestirici';
        if (t.includes('reçine') || t.includes('recine') || t.includes('resin') || t.includes('polyester') || t.includes('vinilester') || t.includes('epoksi')) return 'recine';
        if (t.includes('solvent') || t.includes('aseton') || t.includes('stiren') || t.includes('tiner') || t.includes('toluen')) return 'solvent';
        if (t.includes('hızlandırıcı') || t.includes('hizlandirici') || t.includes('promoter') || t.includes('kobalt') || t.includes('octoate')) return 'hizlandirici';
        if (t.includes('toz') || t.includes('elyaf') || t.includes('fiber') || t.includes('karbon') || t.includes('dust')) return 'toz';
        if (t.includes('ayırıcı') || t.includes('ayirici') || t.includes('kalıp') || t.includes('release') || t.includes('wax')) return 'ayirici';
        return 'recine';
      }

      function parseSdsText(rawText, sourceFileName = '') {
        if (!rawText || typeof rawText !== 'string') return null;
        const cleanText = rawText.replace(/\r\n/g, '\n');
        const sections = sliceSdsSections(cleanText);
        const validation = validateSdsDocument(sections);

        // Strict Gatekeeper: Reject non-SDS documents
        if (!validation.isValid) {
          return {
            isValid: false,
            error: t('sdsNotValidError'),
            detectedCount: validation.count
          };
        }

        // Detect document language
        let docLang = 'en';
        if (/ABSCHNITT|Sicherheitsdatenblatt|Handelsname|Zusammensetzung|Gefahrenhinweise|Erste-Hilfe/i.test(cleanText)) {
          docLang = 'de';
        } else if (/BÖLÜM|BOLUM|Güvenlik Bilgi Formu|Guvenlik Bilgi Formu|Ticari Ad[ıi]|Zararlılık|Zararlilik|İlk Yardım/i.test(cleanText)) {
          docLang = 'tr';
        }

        const s1 = sections[1] || '';
        const s2 = sections[2] || '';
        const s3 = sections[3] || '';
        const s4 = sections[4] || '';
        const s5 = sections[5] || '';
        const s7 = sections[7] || '';
        const s8 = sections[8] || '';
        const s9 = sections[9] || '';
        const s10 = sections[10] || '';

        // 1. Trade Name (Strict extraction from Section 1)
        let tradeName = '';
        const tradeMatch = s1.match(/(?:Ticari Ad[ıi]|Ürün Ad[ıi]|Urun Adi|Trade Name|Product Name|Handelsname|Produktname)[:\s]*([^\n\r]+)/i);
        if (tradeMatch && tradeMatch[1].trim().length > 2) {
          let raw = tradeMatch[1].trim();
          raw = raw.split(/(?:Kimyasal Tan[ıi]m|Chemische Bezeichnung|Chemical Name|Product Code|CAS|Form No|EC No|EG-Nummer|UFI|1\.2)/i)[0].trim();
          tradeName = raw.slice(0, 100);
        } else if (sourceFileName) {
          tradeName = sourceFileName.replace(/\.pdf$/i, '').replace(/[-_]/g, ' ').toUpperCase();
        } else {
          tradeName = docLang === 'tr' ? 'Özel Eklenen Kimyasal' : (docLang === 'de' ? 'Benutzerdefinierte Chemikalie' : 'Custom Added Chemical');
        }

        // 2. CAS Number
        let cas = '';
        const casMatch = (s3 + ' ' + s1 + ' ' + s2).match(/\b(\d{2,7}-\d{2}-\d)\b/);
        if (casMatch) cas = casMatch[1].trim();
        else cas = '—';

        // 3. Category Inference
        const category = inferCategory(tradeName + ' ' + s1 + ' ' + s2);

        // 4. Signal Word & Risk Level
        let signalWordTr = 'UYARI', signalWordEn = 'WARNING', signalWordDe = 'ACHTUNG';
        let riskLevel = 'YÜKSEK';
        if (/TEHL[İI]KE|DANGER|GEFAHR/i.test(s2 + ' ' + cleanText)) {
          signalWordTr = 'TEHLİKE';
          signalWordEn = 'DANGER';
          signalWordDe = 'GEFAHR';
          riskLevel = 'KRİTİK';
        } else if (/UYARI|WARNING|ACHTUNG/i.test(s2 + ' ' + cleanText)) {
          signalWordTr = 'UYARI';
          signalWordEn = 'WARNING';
          signalWordDe = 'ACHTUNG';
          riskLevel = 'YÜKSEK';
        } else {
          signalWordTr = 'DİKKAT';
          signalWordEn = 'CAUTION';
          signalWordDe = 'VORSICHT';
          riskLevel = 'ORTA';
        }

        // 5. GHS Codes & H-Phrases Mapping
        const ghsMatches = (s2 + ' ' + cleanText).match(/GHS0[1-9]/gi) || [];
        let ghsCodes = [...new Set(ghsMatches.map(c => c.toUpperCase()))];
        if (ghsCodes.length === 0) {
          const textAll = s2 + ' ' + cleanText;
          if (/H22[0-8]|H24[12]/i.test(textAll)) ghsCodes.push('GHS02');
          if (/H314|H318/i.test(textAll)) ghsCodes.push('GHS05');
          if (/H300|H310|H330|H301|H311|H331/i.test(textAll)) ghsCodes.push('GHS06');
          if (/H302|H312|H315|H317|H319|H332|H335|H336/i.test(textAll)) ghsCodes.push('GHS07');
          if (/H334|H340|H350|H360|H370|H371|H372|H373|H304/i.test(textAll)) ghsCodes.push('GHS08');
          if (/H400|H410|H411|H412/i.test(textAll)) ghsCodes.push('GHS09');
        }
        if (category === 'peroksit') {
          if (!ghsCodes.includes('GHS02')) ghsCodes.unshift('GHS02');
          if (!ghsCodes.includes('GHS05')) ghsCodes.push('GHS05');
          if (!ghsCodes.includes('GHS07')) ghsCodes.push('GHS07');
        } else if (category === 'sertlestirici') {
          if (!ghsCodes.includes('GHS05')) ghsCodes.unshift('GHS05');
          if (!ghsCodes.includes('GHS07')) ghsCodes.push('GHS07');
        }
        if (ghsCodes.length === 0) ghsCodes = ['GHS07'];

        // 6. Section 4: First Aid
        function getFirstAidSub(patterns) {
          for (const pat of patterns) {
            const re = new RegExp('(?:^|\\n)\\s*(?:[0-9]\\.[0-9]\\s*)?' + pat + '[:\\-\\s]+([\\s\\S]*?)(?=(?:\\n\\s*(?:[0-9]\\.[0-9]\\s*)?(?:G[öo]z|Eye|Augen|Cilt|Deri|Skin|Haut|Soluma|Inhalation|Einatmen|Yutma|Ingestion|Verschlucken|4\\.[0-9]|B[ÖO]L[ÜU]M|SECTION|ABSCHNITT)|$))', 'i');
            const m = s4.match(re);
            if (m && m[1].trim().length > 3) {
              return m[1].trim().replace(/\s+/g, ' ');
            }
          }
          return '';
        }
        const rawEye = getFirstAidSub(['G[öo]z(?:\\s*Temas[ıi])?', 'Eye(?:\\s*Contact)?', 'Augenkontakt', 'Nach\\s*Augenkontakt']);
        const rawSkin = getFirstAidSub(['Cilt(?:\\s*Temas[ıi])?', 'Deri(?:\\s*Temas[ıi])?', 'Skin(?:\\s*Contact)?', 'Hautkontakt', 'Nach\\s*Hautkontakt']);
        const rawInh = getFirstAidSub(['Soluma', 'Solunmas[ıi]', 'Inhalation', 'Nach\\s*Einatmen', 'Einatmen']);
        const rawIng = getFirstAidSub(['Yutma', 'Yutulmas[ıi]', 'Ingestion', 'Nach\\s*Verschlucken', 'Verschlucken']);

        // Timer: extract minutes or default 15 (20 for corrosive GHS05)
        let timerMin = (ghsCodes.includes('GHS05') || category === 'peroksit' || category === 'sertlestirici') ? 20 : 15;
        const timeMatch = (rawEye + ' ' + s4).match(/(?:dakika|minute|minuten|min)\b[\s\S]{0,20}?(\d{1,2})|(\d{1,2})\s*(?:dakika|minute|minuten|min)/i);
        if (timeMatch) {
          const val = parseInt(timeMatch[1] || timeMatch[2], 10);
          if (val >= 10 && val <= 60) timerMin = val;
        }

        // 7. Section 8: PPE (Gloves & Mask)
        let rawGloves = '';
        const gloveMatch = s8.match(/(?:El(?:\\s*Korunmas[ıi])?|Handschutz|Glove(?:\\s*Compatibility)?|Hand\\s*Protection)[:\\s]*([^\n]+(?:\n[^\n]+)?)/i);
        if (gloveMatch) rawGloves = gloveMatch[1].trim().replace(/\s+/g, ' ');

        let rawMask = '';
        const maskMatch = s8.match(/(?:Solunum(?:\\s*Korunmas[ıi])?|Atemschutz|Respirator(?:\\s*Mask)?|Respiratory\\s*Protection)[:\\s]*([^\n]+(?:\n[^\n]+)?)/i);
        if (maskMatch) rawMask = maskMatch[1].trim().replace(/\s+/g, ' ');

        const hasLatexWarning = /lateks.*uygun de[ğg]il|latex.*unsuitable|latex.*keinen schutz/i.test(s8 + ' ' + rawGloves);
        const isButyl = /butyl|b[üu]til/i.test(s8 + ' ' + rawGloves);
        const isNitrile = /nitril|nitrile/i.test(s8 + ' ' + rawGloves);

        // 8. Section 9: Flash Point
        let flashVal = '';
        const flashMatch = s9.match(/(?:Parlama\\s*Noktas[ıi]|Flammpunkt|Flash\\s*Point)[:\\s]*([^\n,;]+)/i);
        if (flashMatch) flashVal = flashMatch[1].trim();

        // 9. Section 5: Firefighting
        let fireSuitable = '';
        const fireSuitMatch = s5.match(/(?:Uygun|Geeignete|Suitable)\s*(?:S[öo]nd[üu]r[üu]c[üu]|L[öo]schmittel|Extinguish)[\w\s]*?[:\-]\s*([^\n]+)/i);
        if (fireSuitMatch) fireSuitable = fireSuitMatch[1].trim();

        let fireProhibited = '';
        const fireProhibMatch = s5.match(/(?:Uygun\\s*Olmayan|Yasak|Unzul[äa]ssige|Prohibited|Inappropriate)\s*(?:S[öo]nd[üu]r[üu]c[üu]|L[öo]schmittel|Extinguish)[\w\s]*?[:\-]\s*([^\n]+)/i);
        if (fireProhibMatch) fireProhibited = fireProhibMatch[1].trim();

        // 10. Section 7 & 10: Storage & Incompatible
        let storageCond = '';
        const storMatch = s7.match(/(?:G[üu]venli\\s*Depolama|Lagerung|Storage|Handhabung|Elle[cç]leme|Handling)[\w\s]*?[:\-]\s*([^\n]+)/i);
        if (storMatch) storageCond = storMatch[1].trim();

        let storageIncomp = '';
        const incompMatch = (s7 + '\n' + s10).match(/(?:Uyu[sş]maz|Unvertr[äa]gliche|Incompatible)[\w\s]*?[:\-]\s*([^\n]+)/i);
        if (incompMatch) storageIncomp = incompMatch[1].trim();

        const notSpecified = docLang === 'tr' ? 'Belirtilmemiş' : (docLang === 'de' ? 'Nicht angegeben' : 'Not specified');

        return {
          id: 'sds_' + Date.now() + '_' + Math.random().toString(36).substring(2, 6),
          isValid: true,
          is_custom: true,
          detected_sections_count: validation.count,

            },

            },

      async function extractTextFromPdfArrayBuffer(arrayBuffer) {
        if (!window.pdfjsLib) {
          throw new Error('PDF.js motoru henüz yüklenemedi.');
        }
        if (!window.pdfjsLib.GlobalWorkerOptions.workerSrc) {
          window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'vendor/pdf.worker.min.js';
        }
        const loadingTask = window.pdfjsLib.getDocument({ data: arrayBuffer });
        const doc = await loadingTask.promise;
        const pageTexts = [];
        for (let i = 1; i <= doc.numPages; i++) {
          const page = await doc.getPage(i);
          const content = await page.getTextContent();
          const pageLines = [];
          let currentLine = [];
          let lastY = null;
          for (const item of content.items) {
            const y = item.transform ? item.transform[5] : null;
            if (lastY !== null && y !== null && Math.abs(y - lastY) > 4) {
              if (currentLine.length > 0) pageLines.push(currentLine.join(' '));
              currentLine = [];
            }
            if (item.str) currentLine.push(item.str);
            if (item.hasEOL) {
              if (currentLine.length > 0) pageLines.push(currentLine.join(' '));
              currentLine = [];
              lastY = null;
            } else {
              lastY = y;
            }
          }
          if (currentLine.length > 0) pageLines.push(currentLine.join(' '));
          pageTexts.push(pageLines.join('\n'));
        }
        return pageTexts.join('\n\n');
      }
