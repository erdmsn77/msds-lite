<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#070a0d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/icon.svg">
  <title>MSDS-Lite | Kompozit & Tekne İSG</title>
  <style>
    :root {
      --bg-base: #070a0d;
      --bg-surface: #0e141a;
      --bg-card: #141c24;
      --bg-card-hover: #1b2631;
      --bg-active: #22303e;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-focus: #ff7828;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      
      --marine-orange: #ff7828;
      --marine-orange-glow: rgba(255, 120, 40, 0.18);
      --marine-amber: #f59e0b;
      --marine-red: #ef4444;
      --marine-emerald: #10b981;
      --marine-cyan: #38bdf8;
      
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: var(--bg-base);
      background-image: 
        radial-gradient(circle at 50% 0%, #172430 0%, #070a0d 70%),
        linear-gradient(180deg, rgba(255,255,255,0.02) 0%, transparent 100%);
      color: var(--text-main);
      font-family: var(--font-sans);
      min-height: 100vh;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }

    .marine-shell {
      max-width: 820px;
      margin: 0 auto;
      padding: 16px 16px 56px;
    }

    /* Top bar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid rgba(255, 120, 40, 0.35);
      color: var(--marine-orange);
      display: grid;
      place-items: center;
      box-shadow: 0 4px 16px var(--marine-orange-glow);
    }
    .brand-eyebrow {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--marine-orange);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--marine-emerald);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
    }
    .brand-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.2;
      color: #fff;
    }
    .brand-subtitle {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Language Switcher */
    .lang-switch {
      display: flex;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 3px;
    }
    .lang-btn {
      border: 0;
      background: transparent;
      color: var(--text-muted);
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 750;
      border-radius: 6px;
      cursor: pointer;
      touch-action: manipulation;
      transition: background-color 0.12s ease, color 0.12s ease;
    }
    .lang-btn.active {
      background: var(--marine-orange);
      color: #000;
      box-shadow: 0 2px 8px var(--marine-orange-glow);
    }

    /* Workshop Controls */
    .controls-panel {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Category Filter Ribbon */
    .category-grid {
      display: flex;
      flex-wrap: nowrap;
      overflow-x: auto;
      gap: 10px;
      padding-bottom: 4px;
      scrollbar-width: none; /* Firefox */
      -ms-overflow-style: none; /* IE/Edge */
      -webkit-overflow-scrolling: touch;
    }
    .category-grid::-webkit-scrollbar {
      display: none;
    }
    .category-card {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 20px; /* Pill shape */
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
      white-space: nowrap;
      flex-shrink: 0;
      transition: border-color 0.15s ease, background-color 0.15s ease, transform 0.1s ease;
    }
    .category-card:hover {
      border-color: rgba(255, 120, 40, 0.35);
      background: var(--bg-card-hover);
    }
    .category-card:active {
      transform: scale(0.97);
    }
    .category-card.active {
      border-color: var(--marine-orange);
      background: rgba(255, 120, 40, 0.1);
      box-shadow: 0 0 0 1px rgba(255, 120, 40, 0.15), 0 4px 12px rgba(255, 120, 40, 0.08);
    }
    .category-card-icon {
      font-size: 16px;
      line-height: 1;
    }
    .category-card-label {
      font-size: 12px;
      font-weight: 750;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
    }
    .category-card.active .category-card-label {
      color: var(--marine-orange);
    }
    .category-card-count {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-dim);
      background: rgba(255, 255, 255, 0.05);
      padding: 2px 6px;
      border-radius: 8px;
    }
    .category-card.active .category-card-count {
      color: var(--marine-orange);
      background: rgba(255, 120, 40, 0.12);
    }



    /* List Meta */
    .list-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-dim);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-top: 4px;
      padding: 0 2px;
    }

    /* Chemical List */
    .chemical-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .chemical-card {
      position: relative;
      display: flex;
      align-items: stretch;
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 0;
      text-align: left;
      cursor: pointer;
      overflow: hidden;
      contain: content;
      touch-action: manipulation;
      transition: border-color 0.12s ease, background-color 0.12s ease;
    }
    .chemical-card:hover {
      border-color: rgba(255, 120, 40, 0.4);
      background: var(--bg-card-hover);
    }
    .chemical-card:active {
      background: var(--bg-active);
    }

    .card-risk-bar {
      width: 5px;
      flex-shrink: 0;
    }
    .risk-critical { background: var(--marine-red); }
    .risk-high { background: var(--marine-orange); }
    .risk-medium { background: var(--marine-amber); }

    .card-content {
      flex: 1;
      padding: 13px 14px;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .card-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .card-category {
      font-size: 10px;
      font-weight: 750;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--marine-cyan);
    }
    .card-risk-pill {
      font-size: 9px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .card-risk-pill.risk-critical {
      color: #fecaca;
      background: rgba(239, 68, 68, 0.18);
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .card-risk-pill.risk-high {
      color: #ffedd5;
      background: rgba(255, 120, 40, 0.18);
      border: 1px solid rgba(255, 120, 40, 0.3);
    }
    .card-risk-pill.risk-medium {
      color: #fef3c7;
      background: rgba(245, 158, 11, 0.18);
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .card-name {
      font-size: 15px;
      font-weight: 750;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-chemical-name {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 5px;
      padding-top: 7px;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
    }
    .card-ghs-chips {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .ghs-diamond-mini {
      width: 22px;
      height: 22px;
      display: inline-block;
      flex-shrink: 0;
    }

    .card-badges {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .stat-badge {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.05);
      padding: 2px 7px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }
    .stat-badge.timer-badge {
      color: var(--marine-orange);
      background: rgba(255, 120, 40, 0.1);
    }
    .card-open-arrow {
      color: var(--text-dim);
      font-size: 16px;
      font-weight: bold;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 40px 16px;
      border: 1px dashed var(--border-subtle);
      border-radius: 12px;
      margin-top: 16px;
    }
    .empty-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-muted);
    }
    .empty-btn {
      margin-top: 12px;
      padding: 8px 16px;
      background: var(--marine-orange);
      color: #000;
      border: 0;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 750;
      cursor: pointer;
    }

    /* Footer */
    .marine-footer {
      margin-top: 36px;
      padding-top: 18px;
      border-top: 1px solid var(--border-subtle);
      font-size: 11px;
      color: var(--text-dim);
      line-height: 1.6;
      text-align: center;
    }

    /* Fast, Hardware Accelerated Drawer System */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(4, 7, 10, 0.75);
      z-index: 90;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .drawer-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(92vw, 490px);
      background: var(--bg-surface);
      border-left: 1px solid var(--border-subtle);
      box-shadow: -10px 0 30px rgba(0, 0, 0, 0.7);
      z-index: 100;
      display: flex;
      flex-direction: column;
      transform: translate3d(100%, 0, 0);
      will-change: transform;
      transition: transform 0.24s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .drawer.open {
      transform: translate3d(0, 0, 0);
    }

    .drawer-header {
      padding: 18px 18px 14px;
      border-bottom: 1px solid var(--border-subtle);
      background: var(--bg-card);
      flex-shrink: 0;
    }
    .drawer-header-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .drawer-category-tag {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--marine-orange);
    }
    .drawer-title {
      font-size: 21px;
      font-weight: 800;
      color: #fff;
      line-height: 1.25;
      margin-top: 2px;
    }
    .drawer-chemical-name {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .drawer-close {
      width: 36px;
      height: 36px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      color: var(--text-muted);
      font-size: 20px;
      display: grid;
      place-items: center;
      cursor: pointer;
      line-height: 1;
      transition: background-color 0.12s ease, color 0.12s ease;
      flex-shrink: 0;
    }
    .drawer-close:hover {
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
    }

    .drawer-nav {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-subtle);
      flex-shrink: 0;
    }
    .drawer-tab {
      border: 0;
      background: transparent;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 750;
      padding: 12px 4px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      touch-action: manipulation;
      transition: color 0.12s ease, border-color 0.12s ease;
      text-align: center;
    }
    .drawer-tab.active {
      color: var(--marine-orange);
      border-bottom-color: var(--marine-orange);
      background: rgba(255, 120, 40, 0.05);
    }

    .drawer-body {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      -webkit-overflow-scrolling: touch;
    }

    /* Incompatibility Alert Box */
    .incompatibility-box {
      border: 1px solid rgba(239, 68, 68, 0.5);
      background: rgba(239, 68, 68, 0.08);
      border-left: 4px solid var(--marine-red);
      border-radius: 8px;
      padding: 12px 14px;
    }
    .incompatibility-box.warning-box {
      border-color: rgba(245, 158, 11, 0.5);
      background: rgba(245, 158, 11, 0.08);
      border-left-color: var(--marine-amber);
    }
    .incompatibility-header {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: #fca5a5;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .warning-box .incompatibility-header {
      color: #fcd34d;
    }
    .incompatibility-title {
      font-size: 13px;
      font-weight: 800;
      color: #fff;
      margin-top: 4px;
    }
    .incompatibility-text {
      font-size: 12px;
      color: #e2e8f0;
      margin-top: 6px;
      line-height: 1.55;
    }
    .incompatibility-source {
      font-size: 10px;
      color: var(--text-dim);
      margin-top: 6px;
      font-weight: 600;
    }

    /* Section Cards in Drawer */
    .drawer-section {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 14px;
    }
    .section-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .section-icon {
      font-size: 14px;
    }
    .section-title {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
    }

    /* Key-Value Rows */
    .metric-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .metric-box {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 10px 12px;
    }
    .metric-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-dim);
    }
    .metric-val {
      font-size: 13px;
      font-weight: 750;
      color: #fff;
      margin-top: 3px;
    }

    /* Large GHS Cards in Drawer */
    .ghs-cards-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .ghs-card-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 10px 12px;
    }
    .ghs-diamond-large {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
    }
    .ghs-card-meta {
      min-width: 0;
    }
    .ghs-card-code {
      font-size: 11px;
      font-weight: 800;
      color: var(--marine-red);
      letter-spacing: 0.05em;
    }
    .ghs-card-name {
      font-size: 13px;
      font-weight: 750;
      color: #fff;
    }
    .ghs-card-desc {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 1px;
    }

    /* Timer Panel */
    .timer-console {
      background: linear-gradient(180deg, #18222b 0%, #11181f 100%);
      border: 1px solid rgba(255, 120, 40, 0.4);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .timer-console.alarm-active {
      border-color: var(--marine-red);
      background: linear-gradient(180deg, #2b1818 0%, #1a1111 100%);
      animation: emergencyPulse 1s infinite alternate;
    }
    @keyframes emergencyPulse {
      from { box-shadow: 0 0 10px rgba(239, 68, 68, 0.2); }
      to { box-shadow: 0 0 25px rgba(239, 68, 68, 0.6); }
    }
    .timer-label {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--marine-orange);
    }
    .timer-console.alarm-active .timer-label {
      color: var(--marine-red);
    }
    .timer-clock {
      font-family: var(--font-mono);
      font-size: 38px;
      font-weight: 800;
      color: #fff;
      letter-spacing: 0.06em;
      margin: 6px 0 12px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }
    .timer-btn-row {
      display: flex;
      gap: 8px;
    }
    .timer-btn {
      flex: 1;
      height: 42px;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      touch-action: manipulation;
      transition: background-color 0.12s ease;
    }
    .timer-btn-primary {
      background: var(--marine-orange);
      color: #000;
      border-color: var(--marine-orange);
    }
    .timer-btn-primary:hover {
      background: #ff8b42;
    }
    .timer-btn-secondary {
      background: var(--bg-surface);
      color: var(--text-main);
    }
    .timer-btn-secondary:hover {
      background: rgba(255,255,255,0.1);
      color: #fff;
    }
    .timer-alarm-notice {
      margin-top: 10px;
      font-size: 11px;
      color: #fca5a5;
      font-weight: 700;
      animation: emergencyPulse 1s infinite alternate;
    }
    .timer-alarm-notice.hidden {
      display: none;
    }

    /* Gloves Table */
    .glove-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .glove-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      background: var(--bg-surface);
      border-radius: 6px;
      font-size: 12px;
    }
    .glove-name {
      font-weight: 600;
      color: var(--text-main);
    }
    .glove-badge {
      font-size: 10px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 4px;
      text-transform: uppercase;
    }
    .glove-badge.safe {
      background: rgba(16, 185, 129, 0.18);
      color: #6ee7b7;
      border: 1px solid rgba(16, 185, 129, 0.35);
    }
    .glove-badge.unsafe {
      background: rgba(239, 68, 68, 0.18);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.35);
    }
    .glove-warning-box {
      margin-top: 10px;
      padding: 10px 12px;
      background: rgba(245, 158, 11, 0.08);
      border-left: 3px solid var(--marine-amber);
      font-size: 11px;
      color: #fde68a;
      line-height: 1.5;
    }

    /* First Aid Box */
    .aid-block {
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .aid-block:last-child {
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: 0;
    }
    .aid-label {
      font-size: 11px;
      font-weight: 800;
      color: var(--marine-cyan);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .aid-text {
      font-size: 12px;
      color: #e2e8f0;
      line-height: 1.55;
    }

    /* Source Info */
    .source-block {
      display: flex;

      function renderGhsDiamond(code, sizeClass = 'ghs-diamond-mini') {
        const meta = GHS_METADATA[code] || GHS_METADATA.GHS07;
        return `<svg viewBox="0 0 100 100" class="${sizeClass}" aria-label="${escape(code)}"><polygon points="50,6 94,50 50,94 6,50" fill="#ffffff" stroke="#ef4444" stroke-width="7" stroke-linejoin="round"/>${meta.svg}</svg>`;

      function formatTime(seconds) {
        const m = Math.floor(seconds / 60);
        const s = seconds % 60;
        return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      }

      // Audio & Vibration Alarm
      function triggerAlarm() {
        state.alarmActive = true;
        // Vibration
        if (typeof navigator !== 'undefined' && 'vibrate' in navigator) {
          try { navigator.vibrate([300, 150, 300, 150, 600]); } catch (e) {}
        }
        // Web Audio synthetic horn
        try {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            const ctx = new AudioContextClass();
            const now = ctx.currentTime;
            const playBeep = (freq, startOffset, duration) => {
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = 'sawtooth';
              osc.frequency.setValueAtTime(freq, now + startOffset);
              gain.gain.setValueAtTime(0.25, now + startOffset);
              gain.gain.exponentialRampToValueAtTime(0.001, now + startOffset + duration);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(now + startOffset);
              osc.stop(now + startOffset + duration);
            };
            playBeep(880, 0.0, 0.18);
            playBeep(880, 0.25, 0.18);
            playBeep(1100, 0.5, 0.35);
          }
        } catch (e) {
          console.warn('Ses alarmı çalınamadı:', e);
        }
      }

      function stopTimer() {
        if (state.timerId) clearInterval(state.timerId);
        state.timerId = null;
        state.timerRunning = false;
      }

      function startTimer() {
        if (state.timerRunning || state.timerSeconds <= 0) return;
        state.timerRunning = true;
        state.alarmActive = false;
        state.timerId = setInterval(() => {
          if (state.timerSeconds > 0) {
            state.timerSeconds -= 1;
            updateTimerDisplay();
            if (state.timerSeconds === 0) {
              stopTimer();
              triggerAlarm();
              updateTimerDisplay();
            }
          }
        }, 1000);
        updateTimerDisplay();
      }

      function toggleTimer() {
        if (state.timerRunning) {
          stopTimer();
          updateTimerDisplay();
        } else {
          if (state.timerSeconds <= 0 && state.selectedChemical) {
            state.timerSeconds = state.selectedChemical.emergency_timer_min * 60;
          }
          startTimer();
        }
      }

      function resetTimer() {
        stopTimer();
        state.alarmActive = false;
        if (state.selectedChemical) {
          state.timerSeconds = state.selectedChemical.emergency_timer_min * 60;
        }
        updateTimerDisplay();
      }

      function updateTimerDisplay() {
        const clock = document.getElementById('timerClock');
        const toggleBtn = document.getElementById('timerToggleBtn');
        const consoleEl = document.getElementById('timerConsole');
        const alertEl = document.getElementById('timerAlarmNotice');

        if (clock) clock.textContent = formatTime(state.timerSeconds);
        if (consoleEl) {
          consoleEl.classList.toggle('alarm-active', state.alarmActive);
        }
        if (alertEl) {
          alertEl.classList.toggle('hidden', !state.alarmActive);
        }
        if (toggleBtn) {
          if (state.timerSeconds <= 0) {
            toggleBtn.textContent = t('resetTimer');
          } else {
            toggleBtn.textContent = state.timerRunning ? t('pauseTimer') : t('startTimer');
          }
        }
      }

      // Filter logic
      function getFilteredChemicals() {
        const query = state.searchQuery.trim().toLocaleLowerCase('tr-TR');
        return state.chemicals.filter((chem) => {
          const catMatches = state.category === 'all' || chem.category === state.category;
          if (!catMatches) return false;
          if (!query) return true;
          const searchSpace = `${chem.name} ${chem.chemical_name} ${chem.category} ${chem.risk_level} ${chem.flash_point} ${chem.source}`.toLocaleLowerCase('tr-TR');
          return searchSpace.includes(query);
        });
      }

      // Fast, targeted list renderer (Only updates list container without re-rendering the shell)
      function renderChemicalList() {
        const listEl = document.getElementById('chemicalList');
        const countEl = document.getElementById('resultsCount');
        if (!listEl) return;

        const filtered = getFilteredChemicals();
        if (countEl) countEl.textContent = `${filtered.length} ${t('records')}`;

        if (filtered.length === 0) {
          listEl.innerHTML = `
            <div class="empty-state">
              <p class="empty-title">${t('noResults')}</p>
              <button type="button" class="empty-btn" id="emptyResetBtn">${t('clearSearch')}</button>

            state.searchQuery = '';

            document.querySelectorAll('.category-card').forEach(c => {

            renderChemicalList();
          });
          return;

          const ghsMiniHtml = chem.ghs_codes.map(c => renderGhsDiamond(c, 'ghs-diamond-mini')).join('');

        const riskClass = chem.risk_level === 'KRİTİK' ? 'risk-critical' : chem.risk_level === 'YÜKSEK' ? 'risk-high' : 'risk-medium';
        const riskText = chem.risk_level === 'KRİTİK' ? t('riskCritical') : chem.risk_level === 'YÜKSEK' ? t('riskHigh') : t('riskMedium');
        const catLabel = (CATEGORIES[chem.category] && CATEGORIES[chem.category][state.language]) || chem.category;

        // Incompatibility alert
        const incomp = INCOMPATIBILITY_ALERTS[chem.id];
        let incompHtml = '';
        if (incomp) {
          const isCrit = incomp.level === 'critical';
          const header = isCrit ? t('incompatibilityNotice') : t('warningNotice');
          const title = state.language === 'tr' ? incomp.title_tr : incomp.title_en;

              <div class="incompatibility-header">⚠️ ${escape(header)}</div>
              <div class="incompatibility-title">${escape(title)}</div>

        }

        // Tab Navigation
        const tabs = [
          { key: 'summary', label: t('summary') },
          { key: 'ppe', label: t('ppe') },
          { key: 'firstAid', label: t('firstAid') },
          { key: 'source', label: t('source') }

        const navHtml = tabs.map(tab => `

        // Tab Body Content
        let tabBodyHtml = '';

        if (state.tab === 'summary') {
          // GHS large cards
          const ghsCardsHtml = chem.ghs_codes.map(c => {
            const meta = GHS_METADATA[c] || GHS_METADATA.GHS07;
            const title = state.language === 'tr' ? meta.title_tr : meta.title_en;

                  <div class="ghs-card-code">${escape(c)}</div>
                  <div class="ghs-card-name">${escape(title)}</div>
                  <div class="ghs-card-desc">${escape(desc)}</div>
                </div>
              </div>
            `;
          }).join('');

          tabBodyHtml = `
            ${incompHtml}

            <!-- Timer Console -->
            <div class="timer-console ${state.alarmActive ? 'alarm-active' : ''}" id="timerConsole">
              <div class="timer-label">⏱ ${t('rinseTimer')}</div>
              <div class="timer-clock" id="timerClock">${formatTime(state.timerSeconds)}</div>
              <div class="timer-btn-row">
                <button type="button" class="timer-btn timer-btn-primary" id="timerToggleBtn">
                  ${state.timerSeconds <= 0 ? t('resetTimer') : (state.timerRunning ? t('pauseTimer') : t('startTimer'))}
                </button>
                <button type="button" class="timer-btn timer-btn-secondary" id="timerResetBtn">
                  ${t('resetTimer')}
                </button>
              </div>
              <div class="timer-alarm-notice ${state.alarmActive ? '' : 'hidden'}" id="timerAlarmNotice">
                🚨 ${t('timeCompleted')} - ${t('timeCompletedHint')}
              </div>
            </div>

            <div class="drawer-section">
              <div class="metric-grid">
                <div class="metric-box">
                  <div class="metric-label">${t('flashPoint')}</div>
                  <div class="metric-val">${escape(chem.flash_point)}</div>
                </div>
                <div class="metric-box">
                  <div class="metric-label">${t('emergencyWash')}</div>
                  <div class="metric-val">${chem.emergency_timer_min} ${state.language === 'tr' ? 'dakika' : 'min'}</div>
                </div>
              </div>
            </div>

            <div class="drawer-section">
              <div class="section-title-row">
                <span class="section-icon">⚠️</span>
                <span class="section-title">GHS TEHLİKE PİKTOGRAMLARI</span>
              </div>
              <div class="ghs-cards-grid">${ghsCardsHtml}</div>
            </div>
          `;
        } else if (state.tab === 'ppe') {
          const gloves = chem.ppe.gloves;
          tabBodyHtml = `
            <div class="drawer-section">
              <div class="section-title-row">
                <span class="section-icon">🤿</span>
                <span class="section-title">${t('mask')}</span>
              </div>
              <div style="font-size:13px; font-weight:600; color:#fff;">${escape(chem.ppe.mask)}</div>
            </div>

            <div class="drawer-section">
              <div class="section-title-row">
                <span class="section-icon">🥽</span>
                <span class="section-title">${t('eyeProtection')}</span>
              </div>
              <div style="font-size:13px; font-weight:600; color:#fff;">${escape(chem.ppe.eye)}</div>
            </div>

            <div class="drawer-section">
              <div class="section-title-row">
                <span class="section-icon">🧤</span>
                <span class="section-title">${t('gloves')}</span>
              </div>
              <div class="glove-list">
                <div class="glove-item">
                  <span class="glove-name">${t('latex')}</span>
                  <span class="glove-badge ${gloves.latex ? 'safe' : 'unsafe'}">${gloves.latex ? t('suitable') : t('unsuitable')}</span>
                </div>
                <div class="glove-item">
                  <span class="glove-name">${t('nitrile')}</span>
                  <span class="glove-badge ${gloves.nitrile ? 'safe' : 'unsafe'}">${gloves.nitrile ? t('suitable') : t('unsuitable')}</span>
                </div>
                <div class="glove-item">
                  <span class="glove-name">${t('butyl')}</span>
                  <span class="glove-badge ${gloves.butyl ? 'safe' : 'unsafe'}">${gloves.butyl ? t('suitable') : t('unsuitable')}</span>
                </div>
              </div>
              <div class="glove-warning-box">
                <strong>İkaz:</strong> ${escape(gloves.warning)}
              </div>
            </div>
          `;
        } else if (state.tab === 'firstAid') {
          tabBodyHtml = `
            ${incompHtml}

            <div class="drawer-section">
              <div class="aid-block">
                <div class="aid-label">👁️ ${t('firstAidEye')} (En az ${chem.emergency_timer_min} dk)</div>
                <div class="aid-text">${escape(chem.first_aid.eye)}</div>
              </div>
              <div class="aid-block">
                <div class="aid-label">✋ ${t('firstAidSkin')}</div>
                <div class="aid-text">${escape(chem.first_aid.skin)}</div>
              </div>
              <div class="aid-block">
                <div class="aid-label">🫁 ${t('firstAidInhalation')}</div>
                <div class="aid-text">${escape(chem.first_aid.inhalation)}</div>
              </div>
            </div>
          `;
        } else if (state.tab === 'source') {
          const sourceLinkHtml = chem.source_url 
            ? `<a href="${escape(chem.source_url)}" class="source-link-btn" target="_blank" rel="noopener noreferrer">${t('openSource')} ↗</a>`
            : `<span style="color:var(--text-dim);">${t('canonicalSource')}</span>`;

          tabBodyHtml = `
            <div class="drawer-section">
              <div class="source-block">
                <div class="source-row">
                  <span style="color:var(--text-muted);">${t('sourceStatus')}:</span>
                  <strong style="color:${chem.verification_status.includes('bekleniyor') ? 'var(--marine-amber)' : 'var(--marine-emerald)'};">${escape(chem.verification_status)}</strong>
                </div>
                <div class="source-row">
                  <span style="color:var(--text-muted);">${t('verifiedAt')}:</span>
                  <span>${escape(chem.verified_at || '—')}</span>
                </div>
                <div class="source-row">
                  <span style="color:var(--text-muted);">${t('canonicalSource')}:</span>
                  <span style="text-align:right; max-width:65%; color:#fff; font-weight:600;">${escape(chem.source)}</span>
                </div>
                <div style="margin-top:4px; text-align:right;">
                  ${sourceLinkHtml}
                </div>
              </div>
            </div>

            <div class="drawer-section">
              <div class="section-title-row">
                <span class="section-icon">ℹ️</span>
                <span class="section-title">${t('scopeNote')}</span>
              </div>
              <div style="font-size:12px; color:#cbd5e1; line-height:1.6;">
                ${escape(chem.verification_note || t('disclaimer'))}
              </div>
            </div>
          `;
        }

        return `
          <div class="drawer-header">
            <div class="drawer-header-top">
              <div>
                <span class="drawer-category-tag">${escape(catLabel)}</span>
                <h2 class="drawer-title" id="drawerTitle">${escape(chem.name)}</h2>
                <div class="drawer-chemical-name">${escape(chem.chemical_name)}</div>
              </div>
              <button type="button" class="drawer-close" id="drawerCloseBtn" aria-label="${t('close')}">✕</button>
            </div>
          </div>
          <nav class="drawer-nav" aria-label="Tabs">
            ${navHtml}
          </nav>
          <div class="drawer-body">
            ${tabBodyHtml}
          </div>
        `;
      }

      function openDrawer(chemicalId, targetTab = 'summary') {
        const chem = state.chemicals.find(c => c.id === chemicalId);
        if (!chem) return;

        state.selectedChemical = chem;
        state.tab = targetTab;
        state.timerSeconds = chem.emergency_timer_min * 60;
        state.alarmActive = false;
        stopTimer();

        // Update URL hash
        try {
          history.replaceState(null, '', '#' + chem.id);
        } catch (e) {}

        const drawer = document.getElementById('detailDrawer');
        const backdrop = document.getElementById('drawerBackdrop');
        if (drawer && backdrop) {
          drawer.innerHTML = renderDrawerContent(chem);
          drawer.classList.add('open');
          drawer.setAttribute('aria-hidden', 'false');
          backdrop.classList.add('open');
          bindDrawerEvents();
        }
      }

      function closeDrawer() {
        stopTimer();
        state.alarmActive = false;
        const drawer = document.getElementById('detailDrawer');
        const backdrop = document.getElementById('drawerBackdrop');
        if (drawer) {
          drawer.classList.remove('open');
          drawer.setAttribute('aria-hidden', 'true');
        }
        if (backdrop) {
          backdrop.classList.remove('open');
        }
        try {
          history.replaceState(null, '', window.location.pathname + window.location.search);
        } catch (e) {}
      }

      function bindDrawerEvents() {
        const drawer = document.getElementById('detailDrawer');
        if (!drawer) return;

        drawer.querySelector('#drawerCloseBtn')?.addEventListener('click', closeDrawer);

        drawer.querySelectorAll('.drawer-tab').forEach(tabBtn => {
          tabBtn.addEventListener('click', () => {
            state.tab = tabBtn.dataset.tab;
            if (state.selectedChemical) {
              drawer.innerHTML = renderDrawerContent(state.selectedChemical);
              bindDrawerEvents();
            }
          });
        });

        drawer.querySelector('#timerToggleBtn')?.addEventListener('click', () => {
          toggleTimer();
        });

        drawer.querySelector('#timerResetBtn')?.addEventListener('click', () => {
          resetTimer();
        });
      }

      function bindShellEvents() {
        const app = document.getElementById('marineApp');
        if (!app) return;

        // Language Switch
        app.querySelectorAll('.lang-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const newLang = btn.dataset.lang;
            if (state.language !== newLang) {
              state.language = newLang;
              localStorage.setItem('msds-language', newLang);
              const drawerWasOpen = document.getElementById('detailDrawer')?.classList.contains('open');
              const selectedId = state.selectedChemical?.id;
              const selectedTab = state.tab;
              renderShell();
              if (drawerWasOpen && selectedId) {
                openDrawer(selectedId, selectedTab);
              }
            }
          });
        });

        // Category Grid Cards (only toggles class and renders list)
        app.querySelectorAll('.category-card').forEach(card => {
          card.addEventListener('click', () => {
            state.category = card.dataset.cat;
            app.querySelectorAll('.category-card').forEach(c => {
              c.classList.toggle('active', c.dataset.cat === state.category);
            });
            renderChemicalList();
          });
        });

        // Event delegation on chemicalList (Fast, zero re-binding)
        const chemicalList = document.getElementById('chemicalList');
        if (chemicalList) {
          chemicalList.addEventListener('click', (e) => {
            const card = e.target.closest('.chemical-card');
            if (card) {
              const chemId = card.dataset.chemicalId;
              openDrawer(chemId, 'summary');
            }
          });
        }

        // Backdrop click closes drawer
        document.getElementById('drawerBackdrop')?.addEventListener('click', closeDrawer);
      }

      // Keyboard Esc to close drawer
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeDrawer();
      });

      // Window Hash change listener (deep-linking)
      window.addEventListener('hashchange', () => {
        const hash = window.location.hash.replace('#', '');
        if (hash) {
          openDrawer(hash);
        } else {
          closeDrawer();
        }
      });

      // Initialization
      async function init() {
        let loaded = fallbackChemicals;
        if (window.location.protocol !== 'file:') {
          try {
            const res = await fetch('./data/chemicals.json', { cache: 'no-store' });
            if (res.ok) {
              const data = await res.json();
              if (Array.isArray(data) && data.length > 0) {
                loaded = data;
              }
            }
          } catch (e) {
            console.warn('JSON fetch failed, using fallback data:', e);
          }
        }
        state.chemicals = loaded;
        renderShell();

        // Check initial hash
        const initialHash = window.location.hash.replace('#', '');
        if (initialHash) {
          openDrawer(initialHash);
        }
      }

      init();
    })();

    // Service Worker Registration
    if ('serviceWorker' in navigator && window.location.protocol !== 'file:') {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { scope: './' })
          .then(() => console.info('MSDS-Lite offline service worker ready.'))
          .catch((err) => console.warn('Service Worker registration failed:', err));
      });
    }
  </script>
</body>
</html>
